  match: ^(?P<k>B2[2-6]0)(?:A|B)?(?:-.*)?$
  codes: {"B220": 20, "B230": 30, "B240": 40, "B250": 50, "B260": 60}
  rating: VR
  kind: schottky
  cite: "https://www.diodes.com/assets/Datasheets/ds13004.pdf, Diodes B220/A -

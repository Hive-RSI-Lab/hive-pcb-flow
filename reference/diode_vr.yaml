# diode_vr.yaml - a diode's reverse-voltage rating read from its part number,
# for check_ratings.py (read through scripts/lib/diode_vr.py mpn_reverse). A
# 2-terminal diode with no datasheet read and no distributor reverse-voltage
# attribute is still rated when its part number belongs to a family below:
# SS14 = 40 V, 1N4007 = 1000 V, SMBJ24A = 24 V standoff (#1323).
#
#   match   regex matched in full on the upper-cased part number, spaces
#           removed; its named group `k` (and `ka` when present) is looked up
#           in `codes`; a `bi` group that matched marks the part
#           bidirectional; anything after the part (packaging, grade: -E3/61T,
#           -7-F, T1G, DPYR) is matched by the regex's tail
#   codes   {k: rated volts}: a part with no row stays unrated, never guessed
#   rating  which row of the datasheet the volts are: VDC or VR (the DC
#           blocking voltage) for a rectifier or Schottky, VRWM (the
#           reverse standoff, working peak) for a TVS or ESD diode. Never
#           the breakdown or clamp voltage: a TVS conducts above its
#           standoff by design, so the standoff is what a rail may sit at
#   kind    rectifier, schottky, signal, tvs or esd
#   cite    the maker's datasheet the numbers were read from (URL, document
#           number and revision, the table)
#
# A family's number is the same across makers where the part number is a
# shared industry number (1N4007, SS14, SMBJ24A); the cite is one maker's
# sheet. Zeners (BZT52, MMSZ, BZX84) and LEDs are left out: a Zener's Value
# is its clamp voltage and it runs in reverse by design, and an LED's
# reverse rating is not a part-number family. A row is added only with the
# sheet in hand.
families:
- name: Vishay 1N4148 small-signal diode
  match: ^(?P<k>1N4148)(?:-.*|TR|TAP)?$
  codes: {"1N4148": 75}
  rating: VR
  kind: signal
  cite: "https://www.vishay.com/docs/81857/1n4148.pdf, Vishay 1N4148, Absolute
    Maximum Ratings: reverse voltage VR 75 V (repetitive peak VRRM 100 V)"
- name: Vishay 1N4001-1N4007 general-purpose rectifier
  match: ^(?P<k>1N400[1-7])(?:[-/].*|G|GP)?$
  codes: {"1N4001": 50, "1N4002": 100, "1N4003": 200, "1N4004": 400,
          "1N4005": 600, "1N4006": 800, "1N4007": 1000}
  rating: VDC
  kind: rectifier
  cite: "https://www.vishay.com/docs/88503/1n4001.pdf, Vishay 1N4001 thru
    1N4007 (Revision 29-Apr-2020), Maximum Ratings: maximum DC blocking
    voltage VDC 50/100/200/400/600/800/1000 V"
- name: Vishay 1N5817-1N5819 Schottky rectifier
  match: ^(?P<k>1N581[7-9])(?:[-/].*)?$
  codes: {"1N5817": 20, "1N5818": 30, "1N5819": 40}
  rating: VDC
  kind: schottky
  cite: "https://www.vishay.com/docs/88525/1n5817.pdf, Vishay 1N5817, 1N5818,
    1N5819 (Revision 01-Jul-2020), Maximum Ratings: maximum DC blocking
    voltage VDC 20/30/40 V"
- name: Diodes Inc. 1N5819HW Schottky rectifier (SOD-123)
  match: ^(?P<k>1N5819HW)(?:-.*)?$
  codes: {"1N5819HW": 40}
  rating: VR
  kind: schottky
  cite: "https://www.diodes.com/assets/Datasheets/ds30217.pdf, Diodes 1N5819HW
    (DS30217 Rev. 23-2), Maximum Ratings: VRRM, VRWM, DC blocking voltage
    VR 40 V"
- name: Vishay SS12-SS16 Schottky rectifier (SMA)
  match: ^(?P<k>SS1[2-6])(?:[-/].*)?$
  codes: {"SS12": 20, "SS13": 30, "SS14": 40, "SS15": 50, "SS16": 60}
  rating: VDC
  kind: schottky
  cite: "https://www.vishay.com/docs/88746/ss12.pdf, Vishay SS12, SS13, SS14,
    SS15, SS16 (Revision 23-Apr-2020), Maximum Ratings: maximum DC blocking
    voltage VDC 20/30/40/50/60 V"
- name: Vishay SS32-SS36 Schottky rectifier (SMC)
  match: ^(?P<k>SS3[2-6])(?:[-/].*)?$
  codes: {"SS32": 20, "SS33": 30, "SS34": 40, "SS35": 50, "SS36": 60}
  rating: VDC
  kind: schottky
  cite: "https://www.vishay.com/docs/88751/ss32.pdf, Vishay SS32, SS33, SS34,
    SS35, SS36 (Revision 23-Apr-2020), Maximum Ratings: maximum DC blocking

# What pins do at reset, for check_straps.py: an MCU's strapping pins, its
# other pins the chip pulls at reset (reset_pulls), and
# the reset behaviour of the parts that can pull or drive them, or that
# hold a board's enables (IO expanders, oscillators).
#
# match: a regex tried against the part's Value (case-insensitive).
# Pins are named as the netlist's pinfunction gives them, upper-cased, with
# an EasyEDA "_<pin number>" suffix and KiCad's ~{...} overbar dropped
# ("IO0_25" -> IO0, "~{INT}_1" -> INT); `aliases` maps other names a
# symbol may use onto those.
# straps: {pin: {pull, want, severity, why}}: pull is the chip's own at reset
# (up | down | none); want is the level the pin must read: high, low, any (no
# level is wrong, the finding is the reading) or defined (high or low, never
# undefined or floating: a boot-mode pin the chip latches with no pull of
# its own, where either level is a choice and no level is a fault).
# vil, vih: the input thresholds, x VDD. vdd_pins: a regex on the names of
# the supply pins of the IO bank the straps sit on (a SoC's boot pins on a
# bank that runs at 1.8 V or 3.3 V): the rail on them, where the netlist's
# net name gives one, is the straps' VDD in place of `vdd`, and `levels`
# ([{vdd, vil, vih}], one per bank voltage) gives the thresholds of the
# entry nearest it.
# glitch: pins the chip itself drives or pulls during power-up, before
# firmware runs (Espressif's "pins with glitches at power-up" tables, and
# the ROM boot log on U0TXD), for check_reset_drive.py: `pins` a regex on
# the canonical pin name, `level` low | high | both | toggle, `us` how long.
# verified: false means typed from memory of the datasheet, not re-read:
# check_straps says so in its finding, and the review that relies on it
# reads the datasheet once and flips it (with the date) here.
# mcu_like: part Values that are an MCU, known here or not. A board with one
# the `mcus` rows don't match has had nothing judged, and check_straps says so
# (mcu_unknown) rather than passing.
mcu_like: '^(ESP-?(01|07|12)[A-Z]?\b|ESP-WROOM-02|ESP-M[0-9]?\b|(Raspberry_?Pi_?)?Pico\b|MDBT[0-9]|STM32|STM8|GD32|CH32|CH5[0-9]|AT32|APM32|HC32|MM32|PY32|N32|ESP32|ESP8266|ESP8285|ESP8684|RP2040|RP2350|NRF5|NRF9|ATMEGA|ATTINY|ATSAM|AT90|SAM[DEL][0-9]|PIC1[0268]|PIC24|PIC32|DSPIC|MSP430|MSPM0|TM4C|TMS320|LPC[0-9]|MK[LEVWS][0-9]|MIMX|MCIMX|EFM32|EFR32|R7FA|R5F|CY8C|XMC[0-9]|LGT8|W80[0-9]|BL60[0-9]|AM62[035]|OSD62[035])'

mcus:
  - family: ESP32
    match: '^ESP32(-D0WD|-D2WD|-S0WD|-U4WDH|-PICO|-WROOM-32|-WROVER|-SOLO|-MINI-1|-WROOM-DA)'
    vdd: 3.3
    vil: 0.25        # x VDD (ESP32 datasheet v4.x Table 5-3 DC characteristics)
    vih: 0.75
    pull_ohm: 45000  # internal weak pull-up/down, nominal
    enable: [EN, CHIP_PU, CHIP_EN]
    aliases: {MTDI: IO12, MTDO: IO15, MTMS: IO14, MTCK: IO13, BOOT: IO0,
              U0TXD: IO1, TXD0: IO1, U0RXD: IO3, RXD0: IO3}
    glitch:
      - pins: '^IO1$'
        level: toggle
        us: 20000
        why: "U0TXD carries the ROM boot log from reset (unless MTDO or the eFuse silences it)"
    straps:
      IO0: {pull: up, want: high, severity: error,
            why: "GPIO0 = 0 boots the UART download mode instead of the flash"}
      IO2: {pull: down, want: low, severity: warning,
            why: "download mode needs GPIO2 = 0 (or floating) with GPIO0 = 0; esptool can't flash the board otherwise"}
      IO12: {pull: down, want: low, severity: error,
             why: "MTDI = 1 sets VDD_SDIO to 1.8 V; the WROOM-32/WROVER(-E) flash and PSRAM are 3.3 V and the module won't boot"}
      IO15: {pull: up, want: any, severity: warning,
             why: "MTDO = 0 silences the ROM boot log on U0TXD (and sets SDIO slave timing)"}
      IO5: {pull: up, want: any, severity: warning,
            why: "GPIO5 sets the SDIO slave timing at boot"}
    source: ESP32 datasheet v4.x §2.4 Strapping Pins; ESP32-WROVER-E datasheet v2.4 §4 Table 5 (strap hold >= 1 ms after CHIP_PU)
    verified: true

  - family: ESP32-S3
    match: '^ESP32-S3'
    vdd: 3.3
    vil: 0.25
    vih: 0.75
    pull_ohm: 45000
    enable: [EN, CHIP_PU, CHIP_EN]
    aliases: {BOOT: IO0, U0TXD: IO43, TXD0: IO43, U0RXD: IO44, RXD0: IO44,
              USB_D-: IO19, USB_D+: IO20}
    glitch:
      - pins: '^IO([1-9]|1[0-7])$'
        level: low
        us: 60
        why: "GPIO1-17 glitch low for ~60 us at power-up"
      - pins: '^IO(18|19)$'
        level: both
        us: 60
        why: "GPIO18/19 glitch low then high for ~60 us each at power-up"
      - pins: '^IO20$'
        level: both
        us: 170000
        why: "GPIO20 is USB_D+: it glitches at power-up, and the USB-Serial-JTAG pull-up holds it high for up to ~170 ms until firmware takes the pin (or an eFuse disables USB)"
      - pins: '^IO43$'
        level: toggle
        us: 20000
        why: "U0TXD carries the ROM boot log from reset"
    straps:
      IO0: {pull: up, want: high, severity: error,
            why: "GPIO0 = 0 boots the download mode instead of the flash"}
      IO46: {pull: down, want: low, severity: warning,
             why: "GPIO46 = 1 with GPIO0 = 0 is an invalid boot combination; download needs it low"}
      IO45: {pull: down, want: low, severity: error,
             why: "GPIO45 = 1 sets VDD_SPI to 1.8 V; 3.3 V flash then fails (unless the eFuse overrides it)"}
      IO3: {pull: none, want: any, severity: warning,
            why: "GPIO3 picks the JTAG source when the eFuses leave it to the strap"}
    source: ESP32-S3 datasheet v1.x §3 Boot Configurations (strapping pins) and §2 pins with glitches at power-up; ESP32-S3 Hardware Design Guidelines (USB_D+ needs an external pull-up or the OTG download eFuse for a stable start)
    verified: false

  - family: ESP32-C3
    match: '^(ESP32-C3|ESP8685)'
    vdd: 3.3
    vil: 0.25
    vih: 0.75
    pull_ohm: 45000
    enable: [EN, CHIP_EN, CHIP_PU]
    aliases: {BOOT: IO9, MTCK: IO6, MTDO: IO7, U0RXD: IO20, RXD0: IO20,
              U0TXD: IO21, TXD0: IO21}
    glitch:
      - pins: '^IO(6|7)$'
        level: high
        us: 0.005
        why: "MTCK and MTDO glitch high for ~5 ns at power-up"
      - pins: '^IO(10|20)$'
        level: low
        us: 0.005
        why: "GPIO10 and U0RXD glitch low for ~5 ns at power-up"
      - pins: '^IO21$'
        level: toggle
        us: 20000
        why: "U0TXD carries the ROM boot log from reset"
    straps:
      IO9: {pull: up, want: high, severity: error,
            why: "GPIO9 = 0 boots the download mode instead of the flash"}
      IO8: {pull: none, want: high, severity: warning,
            why: "download mode needs GPIO8 = 1 with GPIO9 = 0 (it also sets the ROM log)"}
      IO2: {pull: none, want: high, severity: warning,
            why: "Espressif asks for GPIO2 pulled high at boot"}
    # Not straps, but pulled by the chip from reset until firmware drives
    # them: check_straps flags a load these switch on, or a connector they
    # reach with no other pull (load_on_at_reset, reset_pull_offboard).
    reset_pulls:
      # Only MTCK: in the IO MUX table's reset column MTMS (GPIO4) and
      # MTDI (GPIO5) are "1" (input, no pull); MTCK (GPIO6) is "1*", input
      # with the pull-up on while EFUSE_DIS_PAD_JTAG = 0.
      IO6: {pull: up, why: "MTCK: the JTAG pad's pull-up is on from reset (minuet v3: the LED strip came on early)"}
    source: ESP32-C3 datasheet v1.x §2.4 Strapping Pins, §2 power-up glitches (MTCK/MTDO high, GPIO10/U0RXD low, ~5 ns), Table 2-4 IO MUX reset column (MTMS/MTDI "1", MTCK "1*"); ESP32-C3 Hardware Design Guidelines §2.6; minuet v3 design-and-errata.md (GPIO6 pull-up at reset)
    verified: false

  - family: ESP32-C6
    match: '^ESP32-C6'
    vdd: 3.3
    vil: 0.25
    vih: 0.75
    pull_ohm: 45000
    enable: [EN, CHIP_EN, CHIP_PU]
    aliases: {BOOT: IO9, U0TXD: IO16, TXD0: IO16, U0RXD: IO17, RXD0: IO17}
    glitch:
      - pins: '^IO16$'
        level: toggle
        us: 20000
        why: "U0TXD carries the ROM boot log from reset"
    straps:
      IO9: {pull: up, want: high, severity: error,
            why: "GPIO9 = 0 boots the download mode instead of the flash"}
      IO8: {pull: none, want: high, severity: warning,
            why: "download mode needs GPIO8 = 1 with GPIO9 = 0"}
    reset_pulls:
      IO4: {pull: up, why: "MTMS: the JTAG pad's pull-up is on from reset"}
      IO5: {pull: up, why: "MTDI: the JTAG pad's pull-up is on from reset"}
      IO6: {pull: up, why: "MTCK: the JTAG pad's pull-up is on from reset"}
    source: ESP32-C6 datasheet v1.x §3 Boot Configurations and the IO MUX reset column
    verified: false

  # ESP8266EX / ESP8285 and the modules that are the chip and its flash
  # with no strap resistors of their own (ESP-WROOM-02: its schematic, p.17,
  # has R1, the 12 k bias, and R3, the 200 R in SD_CLK, nothing else). The
  # boot mode is latched from MTDO (GPIO15), GPIO0 and GPIO2: flash boot is
  # 0 1 1. Module pads are named IO15, IO2, IO0, EN, TXD, RXD, RST.
  - family: ESP8266
    match: '^(ESP8266|ESP8285|ESP-WROOM-02(?![DU]))'
    vdd: 3.3
    vil: 0.25
    vih: 0.75
    pull_ohm: 45000   # not given by Espressif; the ESP32's nominal
    enable: [EN, CHIP_EN, CHIP_PU, CH_PD, CH_PU]
    aliases: &esp8266_aliases
      {MTDO: IO15, MTDI: IO12, MTMS: IO14, MTCK: IO13, U0TXD: IO1,
       TXD0: IO1, TXD: IO1, U0RXD: IO3, RXD0: IO3, RXD: IO3,
       CHIP_EN: EN, CHIP_PU: EN, CH_PD: EN, CH_PU: EN, CH_PD/EN: EN,
       CH_EN: EN}
    straps: &esp8266_straps
      IO15: {pull: none, want: low, severity: error,
             why: "MTDO (GPIO15) must be low at power-on: high boots the SDIO mode, not the flash"}
      IO0: {pull: up, want: high, severity: error,
            why: "GPIO0 = 0 boots the UART download mode instead of the flash"}
      IO2: {pull: up, want: high, severity: error,
            why: "GPIO2 must be high for both flash boot and UART download"}
      EN: {pull: none, want: defined, severity: error,
           why: "CHIP_EN cannot be left floating (high runs the chip, low holds it off)"}
    cite:
      - {doc: 0a-esp8266ex_datasheet_en.pdf, sha256: 3a038e2fd3040ad06d95d41b16afc8292090339e9f8e728ce46a83db439cecf1, page: 11, table: '', quote: 'GPIO2, GPIO0, and MTDO are used to select booting mode and the SDIO mode;', fields: []}
      - {doc: 0a-esp8266ex_datasheet_en.pdf, sha256: 3a038e2fd3040ad06d95d41b16afc8292090339e9f8e728ce46a83db439cecf1, page: 24, table: '', quote: 'VIH 0.75 VIO', fields: [vih]}
      - {doc: 0a-esp8266ex_datasheet_en.pdf, sha256: 3a038e2fd3040ad06d95d41b16afc8292090339e9f8e728ce46a83db439cecf1, page: 24, table: '', quote: '0.25 VIO', fields: [vil]}
      - {doc: esp8266_hardware_design_guidelines_en.pdf, sha256: ff98aeeed7fd07e2fac43cdeca9b0170e03de395b0c79d28a35a40408a16638c, page: 16, table: '', quote: 'GPIO15, the strapping pin of ESP8266EX, needs to be at low-voltage level when the chip is powered on.', fields: []}
      - {doc: esp8266_hardware_design_guidelines_en.pdf, sha256: ff98aeeed7fd07e2fac43cdeca9b0170e03de395b0c79d28a35a40408a16638c, page: 13, table: '', quote: 'cannot be left', fields: []}
      - {doc: 0c-esp-wroom-02_datasheet_en.pdf, sha256: 092893b04e97d5a8e5c224f03d02062ca5e9523ff86bdc8b689b0c6ba0668750, page: 9, table: '', quote: 'Floating (internal pull-up) or pull up.', fields: []}
      - {doc: 0c-esp-wroom-02_datasheet_en.pdf, sha256: 092893b04e97d5a8e5c224f03d02062ca5e9523ff86bdc8b689b0c6ba0668750, page: 9, table: '', quote: 'UART download: pull down.', fields: []}
      - {doc: 0a-esp8285_datasheet_en.pdf, sha256: dce7d19cb67c8ef99d820888f08cc02e1ee75f878676837df953b2f5f3e06d9d, page: 11, table: '', quote: 'GPIO2, GPIO0, and MTDO are used to select booting mode and the SDIO mode;', fields: []}
    source: Espressif ESP8266EX datasheet p.11 (GPIO2, GPIO0, MTDO select the boot mode) and p.24 (VIL 0.25, VIH 0.75 VIO); ESP8266 Hardware Design Guidelines 2024.10 p.13 (CHIP_EN cannot be left floating), p.16 (GPIO15 low at power-on); ESP-WROOM-02 datasheet p.9 Table 2-1 (IO15 pull down, IO2 floating (internal pull-up) or pull up, IO0 floating or pull up for flash boot) and p.17 module schematic (no strap resistors); ESP8285 datasheet p.11
    verified: true    # read 2026-11-15

  # ESP8266 modules from other makers (Ai-Thinker ESP-01/07/12E/F/S, the
  # WROOM-02D/U, Doit ESP-M): the same chip and straps, but each may carry
  # strap resistors of its own that no datasheet here gives (onboard:
  # unknown). A strap the board leaves floating is then not judged (the
  # module may pull it); one the board pulls to the wrong level still is.
  - family: ESP8266 module
    match: '^(ESP-?(01|07|12)[A-Z]?\b|ESP-WROOM-02[DU]|ESP-M[0-9]?\b)'
    like: ESP8266
    onboard: unknown
    source: as the ESP8266 row; the module's own strap resistors are unknown
    verified: true    # read 2026-11-15 (the chip's rows)

  # ESP32-S2 and its modules (ESP32-S2-WROOM(-I), -WROVER(-I), -SOLO,
  # -MINI-1): flash and PSRAM at 3.3 V, so GPIO45 = 1 (VDD_SPI 1.8 V)
  # stops the module booting.
  - family: ESP32-S2
    match: '^ESP32-S2'
    vdd: 3.3
    vil: 0.25
    vih: 0.75
    pull_ohm: 45000
    enable: [EN, CHIP_PU, CHIP_EN]
    aliases: {BOOT: IO0, U0TXD: IO43, TXD0: IO43, U0RXD: IO44, RXD0: IO44,
              CHIP_PU: EN, CHIP_EN: EN}
    straps:
      IO0: {pull: up, want: high, severity: error,
            why: "GPIO0 = 0 boots the download mode instead of the flash"}
      IO45: {pull: down, want: low, severity: error,
             why: "GPIO45 = 1 sets VDD_SPI to 1.8 V; 3.3 V flash then fails (unless the eFuse overrides it)"}
      IO46: {pull: down, want: low, severity: warning,
             why: "GPIO46 = 1 with GPIO0 = 0 is an invalid boot combination; download needs it low"}
    cite:
      - {doc: esp32-s2_datasheet_en.pdf, sha256: 7c0c54f11e79cc77b09ae070221f056e2c21a3746a8f3a23a0371c4efcf8e02d, page: 29, table: 'Default Configuration of Strapping Pins', quote: 'GPIO0 Weak pull-up 1', fields: []}
      - {doc: esp32-s2_datasheet_en.pdf, sha256: 7c0c54f11e79cc77b09ae070221f056e2c21a3746a8f3a23a0371c4efcf8e02d, page: 29, table: 'Default Configuration of Strapping Pins', quote: 'GPIO45 Weak pull-down 0', fields: []}
      - {doc: esp32-s2_datasheet_en.pdf, sha256: 7c0c54f11e79cc77b09ae070221f056e2c21a3746a8f3a23a0371c4efcf8e02d, page: 29, table: 'Default Configuration of Strapping Pins', quote: 'GPIO46 Weak pull-down 0', fields: []}
      - {doc: esp32-s2-wroom_esp32-s2-wroom-i_datasheet_en.pdf, sha256: ee6d88b23241323c7ea8f833ea00ff522696daf2a32a51ca8cfefb755c8d2ca7, page: 11, table: '', quote: 'Chip boot mode – GPIO0 and GPIO46', fields: []}
    source: ESP32-S2 Series Datasheet v1.9 p.29 Table 3-1 (GPIO0 weak pull-up, GPIO45 and GPIO46 weak pull-down; GPIO45 VDD_SPI, GPIO0/GPIO46 boot mode); ESP32-S2-WROOM datasheet p.11 §3.3
    verified: true    # read 2026-11-15

  # Nordic nRF52840 and modules on it (Raytac MDBT50Q-1MV2/-P1MV2): no
  # strapping pins ("the device will always start independently of the
  # levels present on any of the GPIOs"), so there is nothing to latch;
  # the row is here so the part is judged, not mcu_unknown.
  - family: nRF52840
    match: '^(NRF52840|MDBT50Q-(P|X)?1MV2)'
    vdd: 3.3
    enable: []
    straps: {}
    cite:
      - {doc: nRF52840_PS_v1.5.pdf, sha256: 0ce32d92af358ebd4daf2a9d50c56219468b9e988628f0d512e3feaee96709de, page: 45, table: '', quote: 'independently of the levels present on any of the GPIOs.', fields: []}
      - {doc: MDBT50Q-1MV2_spec_L.pdf, sha256: 61fec8c0c9f8c33175be2237a8ebba73c6cfc0a3572fe3835fd341079c103d03, page: 4, table: '', quote: 'designed based on Nordic nRF52840 SoC solution', fields: []}
    source: Nordic nRF52840 Product Specification v1.5 p.45 §4.5.1.4 PSELRESET (no GPIO level decides the start); Raytac MDBT50Q-1MV2 spec version L p.4 (built on the nRF52840)
    verified: true    # read 2026-11-15

# Parts whose pins pull or drive a net at reset.
#   kind: expander  - every IO pin (pins: regex on the pin name) is an input
#                     at power-on with the internal `pull`; registers are
#                     reset only at POR, or by the part's `reset` pin
#                     (active low), so through an MCU-only reset its outputs
#                     keep whatever firmware set unless that pin follows the
#                     MCU's enable.
#   kind: input     - the named pins are inputs at reset (loads, not drivers)
  # Every GPIO is pulled down from reset (RP2040 datasheet Pinout table,
  # Reset State column; PADS_BANK0 GPIOn reset PDE=1, PUE=0).
  - family: STM32F1
    match: '^STM32F10[0-7]'
    vdd: 3.3
    vil: 0.35              # VIL 0.28 (VDD - 2) + 0.8 V = 1.16 V at 3.3 V
    vih: 0.55              # VIH 0.41 (VDD - 2) + 1.3 V = 1.83 V at 3.3 V
    pull_ohm: 40000        # RPU, RPD 30-50 k
    enable: [NRST]
    aliases: {SWDIO: PA13, JTMS: PA13, SWCLK: PA14, JTCK: PA14, JTDI: PA15,
              NJTRST: PB4, BOOT1: PB2}
    straps:
      BOOT0: {pull: none, want: low, severity: error,
              why: "BOOT0 = 1 boots the system memory (or SRAM with BOOT1 = 1) instead of the main flash"}
    reset_pulls:
      # The serial-wire/JTAG pins come out of reset in their debug function
      # with pulls on; every other GPIO is a floating input. offboard: false,
      # because these pins leave the board to a debug header by design.
      PA13: {pull: up, offboard: false, why: "JTMS/SWDIO's pull-up is on from reset"}
      PA14: {pull: down, offboard: false, why: "JTCK/SWCLK's pull-down is on from reset"}
      PA15: {pull: up, offboard: false, why: "JTDI's pull-up is on from reset"}
      PB4: {pull: up, offboard: false, why: "NJTRST's pull-up is on from reset"}
    source: ST RM0008 §3.4 Boot configuration (BOOT0, BOOT1 = PB2), §9.1.1 GPIO reset state (floating input; JTAG pins PA15/PA13/PB4 pull-up, PA14 pull-down, PB3 floating); STM32F103x8/B datasheet DS5319 I/O static characteristics (VIL, VIH, RPU/RPD 30-50 k)
    verified: false

  - family: RP2040
    match: '^RP2040'
    vdd: 3.3
    vil: 0.242             # VIL 0.8 V at IOVDD 3.3 V
    vih: 0.606             # VIH 2.0 V at IOVDD 3.3 V
    pull_ohm: 65000        # RPU, RPD 50-80 k
    enable: [RUN]
    aliases: {QSPI_CS: QSPI_SS, QSPI_CSN: QSPI_SS, QSPI_SS_N: QSPI_SS,
              QSPI_SSN: QSPI_SS, SWDIO: SWD}
    straps:
      QSPI_SS: {pull: up, want: high, severity: error,
                why: "the boot ROM skips flash when the QSPI chip select is tied low (the BOOTSEL button)"}
      TESTEN: {pull: down, want: low, severity: error,
               why: "factory test mode pin: tie to GND"}
    reset_pulls:
      # offboard: false, because every GPIO has this pull: a load it turns on
      # is load_on_at_reset, but each pin leaving the board isn't a finding.
      IO0: &rp_pd {pull: down, offboard: false,
                   why: "RP2040 GPIOs are pulled down from reset"}
      IO1: *rp_pd
      IO2: *rp_pd
      IO3: *rp_pd
      IO4: *rp_pd
      IO5: *rp_pd
      IO6: *rp_pd
      IO7: *rp_pd
      IO8: *rp_pd
      IO9: *rp_pd
      IO10: *rp_pd
      IO11: *rp_pd
      IO12: *rp_pd
      IO13: *rp_pd
      IO14: *rp_pd
      IO15: *rp_pd
      IO16: *rp_pd
      IO17: *rp_pd
      IO18: *rp_pd
      IO19: *rp_pd
      IO20: *rp_pd
      IO21: *rp_pd
      IO22: *rp_pd
      IO23: *rp_pd
      IO24: *rp_pd
      IO25: *rp_pd
      IO26: *rp_pd
      IO27: *rp_pd
      IO28: *rp_pd
      IO29: *rp_pd
      SWCLK: {pull: up, why: "SWCLK's pull-up is on from reset"}
      SWD: {pull: up, why: "SWD's pull-up is on from reset"}
    source: RP2040 datasheet build 2025-02-20 (3184e62) Pinout section Reset State column (GPIO pull-down, QSPI_CSn/SWCLK/SWD/RUN pull-up, TESTEN pull-down), PADS_BANK0 GPIOn register, IO electrical table (VIH 2 V, VIL 0.8 V at 3.3 V, RPU/RPD 50-80 k), bootrom "Check if SPI CS pin is tied low", section 1.4.3 "TESTEN Factory test mode pin. Tie to GND."
    verified: true

  # Raspberry Pi Pico and Pico W: an RP2040 board whose header pins are
  # the chip's GPIOs (named GPIOn, GPn or GPIOn_ADCm on the symbols) and its
  # RUN pin. The RP2040's straps (QSPI_SS, TESTEN) don't reach the header,
  # so what is judged is the reset pull-downs on the GPIOs (a load they
  # switch on). Not the Pico 2 (RP2350).
  - family: Raspberry Pi Pico
    match: '^(Raspberry_?Pi_?)?Pico(_?W|_?H|_?WH)?(?![0-9 ]?2(\b|W))\b'
    like: RP2040
    cite:
      - {doc: pico-datasheet.pdf, sha256: 757ff485227493b9fcc0c2c96c4dea9de020e1d8b2b11e2aa4f9ee8b25aa89eb, page: 20, table: '', quote: 'The Pico exposes 26 of the 30 possible RP2040 GPIO pins by routing them straight out to Pico header pins.', fields: []}
      - {doc: pico-datasheet.pdf, sha256: 757ff485227493b9fcc0c2c96c4dea9de020e1d8b2b11e2aa4f9ee8b25aa89eb, page: 9, table: '', quote: 'RUN is the RP2040 enable pin, and has an internal (on-chip) pull-up resistor to 3.3 V of about ~50 kΩ.', fields: []}
      - {doc: pico-w-datasheet.pdf, sha256: ba8649ba98437301b9f1621504569a27f1d2ba6111795b4df76783adb08de7c5, page: 14, table: '', quote: 'Pico W exposes 26 of the 30 possible RP2040 GPIO pins by routing them straight out to Pico W header pins.', fields: []}
    source: Raspberry Pi Pico datasheet p.9 (RUN, on-chip pull-up) and p.20 (GPIOs routed straight to the header); Pico W datasheet p.14; the RP2040 row for the pulls
    verified: true    # read 2026-11-15

  # TI AM62x (AM625, AM623, AM620) and Octavo's OSD62x SiPs built on it,
  # whose symbols name the AM62x's own balls. BOOTMODE[15:0] share the
  # GPMC0_AD0..15 balls, which have no pull during reset (Table 5-1, "during
  # reset": RX on, pull off) and are latched on PORz_OUT's rising edge, so
  # each needs a pull of its own to VDDSHV3 or VSS (Table 5-74): a ball left
  # floating boots whatever level it drifts to.
  - family: AM62x
    match: '^(AM62[035]|OSD62[035])'
    vdd: 3.3               # when the netlist names no rail on VDDSHV3
    vdd_pins: '^VDDSHV3$'  # the BOOTMODE balls' IO bank, 1.8 V or 3.3 V
    levels:                # LVCMOS VIL/VIH x VDDSHV3 (section 6.8.6)
      - {vdd: 1.8, vil: 0.35, vih: 0.65}
      - {vdd: 3.3, vil: 0.242, vih: 0.606}   # VIL 0.8 V, VIH 2.0 V
    vil: 0.242
    vih: 0.606
    pull_ohm: 22000        # RPU, RPD 15-30 k
    enable: [MCU_PORZ]
    aliases: {GPMC0_AD0: BOOTMODE00, GPMC0_AD1: BOOTMODE01,
              GPMC0_AD2: BOOTMODE02, GPMC0_AD3: BOOTMODE03,
              GPMC0_AD4: BOOTMODE04, GPMC0_AD5: BOOTMODE05,
              GPMC0_AD6: BOOTMODE06, GPMC0_AD7: BOOTMODE07,
              GPMC0_AD8: BOOTMODE08, GPMC0_AD9: BOOTMODE09,
              GPMC0_AD10: BOOTMODE10, GPMC0_AD11: BOOTMODE11,
              GPMC0_AD12: BOOTMODE12, GPMC0_AD13: BOOTMODE13,
              GPMC0_AD14: BOOTMODE14, GPMC0_AD15: BOOTMODE15,
              BOOTMODE0: BOOTMODE00, BOOTMODE1: BOOTMODE01,
              BOOTMODE2: BOOTMODE02, BOOTMODE3: BOOTMODE03,
              BOOTMODE4: BOOTMODE04, BOOTMODE5: BOOTMODE05,
              BOOTMODE6: BOOTMODE06, BOOTMODE7: BOOTMODE07,
              BOOTMODE8: BOOTMODE08, BOOTMODE9: BOOTMODE09}
    straps:
      BOOTMODE00: &am62_boot {pull: none, want: defined, severity: error,
                              why: "the boot mode is latched from BOOTMODE[15:0] on PORz_OUT's rising edge, and these balls have no pull during reset: each needs its own pull up or down (SPRSP58C Table 5-74)"}
      BOOTMODE01: *am62_boot
      BOOTMODE02: *am62_boot
      BOOTMODE03: *am62_boot
      BOOTMODE04: *am62_boot
      BOOTMODE05: *am62_boot
      BOOTMODE06: *am62_boot
      BOOTMODE07: *am62_boot
      BOOTMODE08: *am62_boot
      BOOTMODE09: *am62_boot
      BOOTMODE10: *am62_boot
      BOOTMODE11: *am62_boot
      BOOTMODE12: *am62_boot
      BOOTMODE13: *am62_boot
      BOOTMODE14: *am62_boot
      BOOTMODE15: *am62_boot
    source: TI SPRSP58C (AM625, AM623, AM620-Q1 datasheet, rev. C, October 2025) Table 5-1 Pin Attributes (GPMC0_AD0..15 carry BOOTMODE00..15 on VDDSHV3, 1.8 V / 3.3 V, pull off during and after reset), Table 5-74 Connectivity Requirements (each through its own external pull to the supply or VSS to select the boot mode), Table 6-15 BOOTMODE Timing Requirements (valid before PORz_OUT goes high), section 6.8.6 LVCMOS Electrical Characteristics (1.8 V mode VIL 0.35 VDD, VIH 0.65 VDD; 3.3 V mode VIL 0.8 V, VIH 2.0 V; RPU/RPD 15-30 k)
    verified: true

parts:
  - match: '^(TCA9555|PCA9555)'
    kind: expander
    pins: '^P[01][0-7]$'
    pull: {dir: up, ohm: 100000}
    reset: null
    source: TI TCA9555 SCPS200E §5 and Fig. 23 (100 k internal pull-ups; POR only); NXP PCA9555 rev. 9 §8.1
    verified: true
  - match: '^(TCA9535|PCA9535|TCA9554|PCA9554|TCA9534|PCA9534|TCA9538|PCA9538)'
    kind: expander
    pins: '^P[01]?[0-7]$'
    pull: null
    reset: [RESET]     # TCA9538/PCA9538 only; the others have none
    source: TI TCA9535 SCPS201 (no pull-ups, POR only); TI TCA9534/TCA9538 datasheets
    verified: false
  - match: '^(TCA9539|PCA9539|TCA6416|TCA6408|PCAL6416|PCAL9555)'
    kind: expander
    pins: '^P[01]?[0-7]$'
    pull: null
    reset: [RESET]
    source: TI TCA9539 SCPS202C §8.3.2 (RESET pin, no pull-ups); TI TCA6416A SCPS194
    verified: false
  - match: '^MCP23(0|S)(08|17|18)'
    kind: expander
    pins: '^GP[AB]?[0-7]$'
    pull: null
    reset: [RESET]
    source: Microchip MCP23017 DS20001952 §1.6 (GPPU = 0 at reset, RESET pin)
    verified: false
  - match: '^PCF857[45]'
    kind: expander
    pins: '^P[01]?[0-7]$'
    pull: {dir: up, ohm: 33000}   # quasi-bidirectional: ~100 uA weak high at POR
    reset: null
    source: NXP PCF8574 §8.2 (outputs high with a weak current source at power-on)
    verified: false
  - match: '^LAN8720'
    kind: input
    pins: '^(NRST|RST|XTAL1/CLKIN|XTAL1|CLKIN|MDC|TXD[01]|TXEN)$'
    source: Microchip LAN8720A DS00002165B pin table
    verified: false
  - match: '^(W25Q|GD25Q|MX25[LU]|IS25[LW]P|AT25[SQ]F|S25FL)'
    kind: input
    pins: '^(CS|CS#|CSN|NCS|SS|SS#|/CS)$'
    source: SPI NOR flash pin tables (Winbond W25Q128JV CS input, no driver on it)
    verified: false
  - match: '^PCM510[0-9]'
    kind: input
    pins: '^(BCK|DIN|LRCK|SCK|XSMT|FMT|FLT|DEMP)$'
    source: TI PCM5102A SLAS859 pin functions (digital inputs)
    verified: false
  - match: '^ES9018K2M'
    kind: input
    pins: '^(DATA_CLK|DATA[12]|SCL|SDA|ADDR|RESETB|GPIO[12])$'
    source: ESS ES9018K2M datasheet v3.7 (2021-04-22) p.4 pin descriptions, Reset State column (DATA_CLK, DATA1, DATA2, SCL, SDA, ADDR, RESETB, GPIO1, GPIO2 all Tri-stated; DATA_CLK is an output only in master mode, a register setting)
    verified: true
  - match: '^ES7243E'
    kind: input
    pins: '^(MCLK|SCLK|LRCK|TDMIN|AD[01]|CCLK|CDATA)$'
    source: Everest ES7243E datasheet rev 2.0 (June 2019) p.4 pin table (MCLK, TDMIN, AD0, AD1, CCLK are inputs) and p.13 (register MSC bit 6 = 0 slave mode, default, so SCLK and LRCK are inputs at reset)
    verified: true
  - match: '^ES8388'
    kind: input
    pins: '^(MCLK|DSDIN|CE|CCLK|[LR]IN[12])$'
    source: Everest ES8388 datasheet rev 5.0 (July 2018) p.6 pin table (MCLK, DSDIN, CE, CCLK, LIN/RIN are inputs). SCLK and LRCK are left out on purpose - register 8 MSC defaults to master (p.16) - so a strap on them stays flagged
    verified: true

# Oscillators are found by their pins, not their Value: a part whose
# reference starts with Y, X or OSC and which has an output pin (`output`)
# drives a clock whenever its enable pin (`enable`) is high or floating
# (the YSO110TR, SiT8008 and most XOs read a floating OE as enabled); a
# part with an output and no enable pin always runs.
oscillators:
  refs: '^(Y|X|OSC)[0-9]'
  output: '^(OUT|OUTPUT|CLK|CLKOUT|FOUT)$'
  enable: '^(OE|EN|ST|STBY|TRI-STATE|TRISTATE|E/D|OE/ST)$'
  enable_active: high
  float_enabled: true
  source: YXC YSO110TR datasheet p1 (enable "high voltage or floating"); SiTime SiT8008 OE/ST

# MOSFETs whose gate an enable line drives: the minimum VGS(th), so a gate
# that comes up mid-band at power-on can be told to conduct (review-2
# POWER-5: core's Q2 at 1.10 V).
fets:
  - match: '^2N7002'
    vth_min: 1.0
    source: JSCJ 2N7002 datasheet, VGS(th) 1.0-2.5 V at ID 250 uA
    verified: true
  - match: '^(BSS138|BSS138K)'
    vth_min: 0.8
    source: onsemi BSS138 datasheet, VGS(th) 0.8-1.5 V
    verified: false
  - match: '^(AO3400|AO3400A)'
    vth_min: 0.65
    source: AOS AO3400A datasheet, VGS(th) 0.65-1.45 V
    verified: false

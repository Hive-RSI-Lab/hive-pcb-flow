# Switching frequency of a converter whose output-cap ripple check_current
# reads (#798): dI / sqrt(12), dI = Vout * (1 - D) / (L * fsw). A part with no
# row and no buck block fsw_khz stays unjudged, and says so.
#
# match: a regex tried against the part's Value and MPN fields
# (case-insensitive). fsw_hz: the datasheet's typical. source: where it was read.
# verified: true means the datasheet was re-read for this row. Add a row only
# from a datasheet in hand, never from memory.
# rt: instead of fsw_hz, a part whose frequency one resistor sets, from the
# IC's `pin` to ground: fsw = k / (R + offset_ohm), the datasheet's equation,
# used only inside its range_hz (check_current.row_fsw). A part synchronised
# to an outside clock runs at that clock instead, which no row knows.
regulators:
  - match: '^SCT2A25'
    fsw_hz: 300000
    source: SCT2A25 datasheet, FSW 260/300/340 kHz, "fixed at 300KHz" (LCSC C5124114)
    verified: true
  - match: '^AP6320[35]'
    fsw_hz: 1100000
    source: >-
      Diodes DS41326 Rev. 3-2 p. 5, "fSW Oscillator Frequency AP63203/AP63205
      1100 kHz" (typical only; AP63200/AP63201 are 500 kHz)
    verified: true
  - match: '^AP6320[01]'
    fsw_hz: 500000
    source: Diodes DS41326 Rev. 3-2 p. 5, "fSW Oscillator Frequency AP63200/AP63201 500 kHz"
    verified: true
  - match: '^LMR33630A'
    fsw_hz: 400000
    source: TI SNVSAN3F p. 8, "ƒSW Switching frequency "A" Version 340 400 460 kHz"
    verified: true
  - match: '^LMR33630B'
    fsw_hz: 1400000
    source: TI SNVSAN3F p. 8, "ƒSW Switching frequency "B" Version 1.2 1.4 1.6 MHz"
    verified: true
  - match: '^LMR33630C'
    fsw_hz: 2100000
    source: TI SNVSAN3F p. 8, "ƒSW Switching frequency "C" Version 1.8 2.1 2.4 MHz" (DDA; RNX 2.3 max)
    verified: true
  - match: '^TLV62569'
    fsw_hz: 1500000
    source: TI SLVSDG1C p. 5, "fSW Switching frequency VOUT = 2.5 V 1.5 MHz" (typical only)
    verified: true
  - match: '^TPS62A01'
    fsw_hz: 2400000
    source: TI SLUSEG9E p. 5, "fSW(FCCM) Switching frequency, FPWM operation VIN = 5 V; VOUT = 1.8 V 2400 kHz"
    verified: true
  - match: '^LMR54406'
    fsw_hz: 1100000
    source: TI SLUSEG8E p. 5, "FOSC Internal oscillator frequency 0.935 1.1 1.265 MHz"
    verified: true
  - match: '^SY7208C'
    fsw_hz: 1000000
    source: Silergy AN_SY7208C Rev. 0.9 p. 3, "Switching Frequency Fsw 0.8 1 1.2 MHz" (LCSC C178234)
    verified: true
  - match: '^SY8301'
    fsw_hz: 2000000
    source: Silergy AN_SY8301 Rev. 0.9A p. 4, "Switching Frequency fSW 1.6 2 2.4 MHz" (LCSC C2927130)
    verified: true
  - match: '^SY7200A'
    fsw_hz: 1000000
    source: Silergy SY7200A Rev. 1.0 p. 3, "Oscillator Frequency FOSC IOUT=100mA 0.8 1.0 1.2 MHz" (LCSC C107309)
    verified: true
  - match: '^LM5158'          # LM5158 and LM51581
    rt: {pin: RT, k: 2.21e+10, offset_ohm: 955, range_hz: [100000, 2200000]}
    source: >-
      TI SNVSBZ7 (October 2021) p. 18, 9.3.4 Equation 5, "RT = 2.21 x 10^10 /
      fRT(TYPICAL) - 955", an RT resistor "between the RT and the AGND pins";
      p. 6, fSW 100 to 2200 kHz; p. 7, "fsw1 Switching frequency RT = 220 kOhm
      85 100 115 kHz" (and 440 kHz at 49.3 kOhm, 2200 kHz at 9.09 kOhm). URL
      https://www.ti.com/lit/ds/symlink/lm5158.pdf sha256
      7b9f95c93b3552ce2319676102e94d5f83863107dde2ae57eb91d2b86847c39f
    verified: true

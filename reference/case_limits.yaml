# case_limits.yaml - the largest part a chip case holds, for
# check_fp_package.py's passive_case_limit rule (read through
# scripts/lib/case_limits.py).
#
#   capacitors  one row per (case, dielectric, voltage columns): `value` is
#               the largest capacitance that maker's lineup chart offers in
#               that case at those rated voltages. The quote is the chart's
#               row (its label is the capacitance; the cells are thickness
#               codes), so the voltage columns were read from the cells'
#               x-positions on the page, not from the quote.
#   resistors   one row per case: `power` is the rated power at 70 C, the
#               larger option where the maker offers two (Yageo's "2 x
#               standard power" reels). The quote writes it as a fraction,
#               so it is checked by eye, not by --verify.
#
# Two makers only: Yageo and KEMET MLCC charts, and Yageo RC_L resistors
# (whose 2x option is at or above Panasonic ERJ's rating in every case).
# Murata, TDK and Samsung may list larger parts in some cells, so the rule
# takes the larger maker per cell and flags only a part well above it.
# `scripts/part_rows.py --verify reference/case_limits.yaml --pdf ...` finds
# each quote on its page. Add a row only with its PDF in hand.

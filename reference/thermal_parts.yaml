# Power ICs check_thermal screens when constraints.json gives no thermal
# entry for them (the minuet v3 miss, #884: an MCF8316D three-phase motor
# driver on 2-layer copper reached over-temperature at 4.5 A per phase, and
# with no constraints.json nothing told check_thermal it dissipated at all).
#
# match: a regex tried against the part's Value and MPN fields
# (case-insensitive). tj_max_c: the recommended-operating junction maximum.
# packages: one entry per package, each {name, pkg, theta_ja_c_w,
# exposed_pad, cite}: pkg a regex tried against Value, MPN and the
# footprint library name (first match wins; a row with one package needs
# none), theta_ja_c_w the datasheet's JEDEC junction-to-ambient figure,
# exposed_pad whether the package sheds its heat through a pad or tab
# soldered to copper. A row may instead give theta_ja_c_w (and exposed_pad)
# at its top level, for its only package.
#
# An exposed-pad package is screened: the check finds the copper on the
# part's exposed-pad net and flags the board when even the most favourable
# of its copper models gives more than THETA_RATIO_MAX (2x) the package's
# figure: the part can then shed under half the heat the datasheet's board
# sheds before its thermal limits. A package with no exposed pad sheds
# through its leads, so board copper says little; without a load it is
# listed in the report's candidates as no_load, with the dissipation that
# would take it to tj_max_c (a screen ceiling, not a judgement).
#
# Optional, to put a current in the finding: tj_warn_c (the die temperature
# its thermal warning trips at, the datasheet minimum) and a loss model:
#   loss: three_phase, r_hs_ls_ohm: R   conduction in a three-phase bridge at
#       a sinusoidal peak phase current I: P = 3 (I^2 / 2) (R / 2), R the
#       high-side + low-side on-resistance (one of the two conducts per phase
#       at a time). Switching and supply losses are left out, so the current
#       reported is an upper bound.
#   peak_a: the part's rated peak current, quoted beside it.
# source / verified / cite as in source_limits.yaml (part_rows.py --verify
# checks each cite against its PDF; a package's cite is its theta_ja_c_w).
#
# families: power ICs with no row yet. check_thermal lists a part one
# matches (or one a regulator row of switch_nodes, regulator_vref,
# converter_fsw or source_limits matches) as a candidate with reason
# no_row, so a not_judged result says which row is missing.
parts:
  - match: '^MCF8316D'
    theta_ja_c_w: 25.7
    exposed_pad: true
    tj_warn_c: 135
    loss: three_phase
    r_hs_ls_ohm: 0.140
    peak_a: 8.0
    source: >-
      TI MCF8316D SLLSFX9A: 6.4 Thermal Information (RGF VQFN-40 RthetaJA
      25.7 C/W); 6.5 RDS(ON) high-side + low-side 140 mOhm typ at TJ 150 C;
      TOTW 135 C min; features (8-A peak)
    verified: true
  - match: ^TPS629203

# mpn_packages.yaml - a part's package read from its MPN's ordering code, for
# check_fp_package.py (read through scripts/lib/mpn_decode.py). When the LCSC
# record has no package, or there is no record, the maker's ordering code
# still names the package: TI's package designator (SN74HC595D = SOIC-16
# narrow, ...PW = TSSOP), ST's pin-count and package letters (STM32F103C8T6 =
# LQFP-48), Microchip's package code (-SN 3.90 mm SOIC, -SM 5.28 mm SOIC),
# the onsemi, Nexperia, Vishay and Infineon order numbers, the SPI flash
# package codes (Winbond W25Q..SN 150 mil SOIC, ..SS 208 mil, ..ZP WSON 6x5;
# GigaDevice, Macronix, ISSI) and Diodes Inc's diode order codes (B140-13-F
# SMA, B140B-13-F SMB).
#
#   match   regex matched in full on the upper-cased MPN, spaces removed;
#           its named groups pick rows from `groups`
#   groups  {group: {code: row}}: a code with no row leaves the part not
#           judged, never guessed
#   row     a fixed row for every MPN the entry matches
#   combos  rows that hold only when several groups agree (`when`), and,
#           with `part`, only for MPNs that regex matches
#   row     package, family (a lib/pkgname family), mount, pin_count, pitch,
#           width (mm), width_in (inches) or width_mil (mils), body
#           [a, b] mm, cite
#   open    true on a generic JEDEC name (1N4007, 1N5819): its row is the
#           registered package (DO-41), one candidate among the bodies other
#           makers sell it in, never the part's package on its own
#
# Every row is read from the maker's own datasheet page (cite: doc, sha256,
# page, the quote, the fields it fixes) and `scripts/part_rows.py --verify
# reference/mpn_packages.yaml --pdf ...` finds each quote on its page. Add a
# row only with its PDF in hand.
makers:
- name: Texas Instruments
  verified: true
  match: ^(?:SN74|SN65|SN75|TPS|TLV|TPD|TLC|TXS|TXB|TCA|OPA|INA|ADS|BQ|DRV|ISO|HDC|CC)[A-Z0-9]*?\d[A-Z]{0,2}?(?P<code>DGV|RGY|DBV|DCK|DRL|DYA|DPW|DRY|DSF|DQN|DQE|DQA|RVZ|DSG|DMQ|RPA|RSM|RHB|RHA|RTA|DAP|DGK|DGN|DCT|DCU|DDF|DW|DB|PW|NS|PS|D|N|P)(?:[RT]|[23])?(?:G4|E4)?(?:Q1)?$

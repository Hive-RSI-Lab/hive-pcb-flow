# What an MCU pin can do, for netlist_audit.py's pin-function rules (#1032):
# which timer channels each GPIO brings out, which pins are input-only; and
# the loads whose inputs need one of those functions.
#
# mcus: match is a regex tried against the part's Value first and only then
# its symbol name (a C051 is often drawn with a C031 symbol), case-insensitive.
# Pins are named as the netlist's pinfunction gives them, upper-cased, cut at
# the first '-' or '/' (PA14-BOOT0 is PA14, RDY0/SLRD is RDY0).
#   timers      GPIO: the TIMn_CHx / TIMn_CHxN outputs its alternate
#               functions bring out (CHxN is channel x's complement, so it
#               shares channel x)
#   input_only  pins the part can only read
#   i2c         GPIO: the one I2C block and line (I2C0_SDA) its alternate
#               function brings out; a pin named GP4 or GPIO26_ADC0 is
#               looked up by its GPIOn
#   source      where the table comes from: the document, its revision, the table
#   debug       the serial-wire debug signals and the one pin each is on
#               (SWDIO: PA13); an SWD-named net or header pin on any other
#               pin is debug_pin_wrong, an SWD pin wired to other parts with
#               no header or pad is debug_pins_reused (netlist_audit rule 31)
#   shared      a pin's other role at reset (PA14: BOOT0 on STM32G0/C0)
#
# loads: parts whose inputs need an MCU function.
#   pwm_group   the inputs that take PWM; every such input of every load of
#               this row driven from one MCU must fit on distinct channels
#               of a single timer, so they share one counter: one PWM
#               frequency and aligned edges
#   when        the rule holds only with this pin in one of these states
#               (pin_states.yaml's state words)
#   pwm_pairs   [high, low] input pairs of a gate driver; each pair, fed
#               from one MCU, must come from one channel's CHx and CHxN
#               (either way round) and all pairs from distinct channels
#               of a single timer (#1115)
#   aliases     other names a symbol uses for those pins
#
# chip_select: a memory or peripheral chip-select input (~CS, nCS, CS#,
# SCS) joined, directly or over a 0 ohm link, to an input_only MCU pin:
# the MCU can watch that select but never drive it.
#
# Seeded from the errata corpus's pin-function defects (#1032): bedlift-5
# (a motor driver input off its timer) and glasgow-10 (a flash select on
# the FX2's input-only RDY0). glasgow-8 and bedlift-3 are firmware choices
# no datasheet fixes (every STM32G0 GPIO takes an EXTI line; the DRV8434S
# accepts steps over SPI), so the corpus marks them not_static.
#
# The DRV8300 pairs row (#1115) is seeded from PCB-0018's bldc board, which
# feeds INHx/INLx from the G431's TIM1 CH1-3/CH1N-3N; its tests plant a
# leg moved off its channel's complement.

mcus:
  - mpn: STM32C031
    match: '^STM32C031'
    verified: true   # read 2026-11-14 from the XML at that commit
    source: >-
      STMicroelectronics STM32_open_pin_data (the STM32CubeMX pin database
      behind the DS13836 alternate-function tables), commit 7d1f1514ed55,
      mcu/STM32C031K(4-6)Tx.xml
    debug: {SWDIO: PA13, SWCLK: PA14}   # DEBUG_SWDIO, DEBUG_SWCLK
    shared: {PA14: BOOT0}               # pin PA14-BOOT0
    timers:
      PA0: [TIM16_CH1, TIM1_CH1]
      PA1: [TIM17_CH1, TIM1_CH2]
      PA2: [TIM16_CH1N, TIM1_CH3]
      PA3: [TIM1_CH1N, TIM1_CH4]
      PA4: [TIM14_CH1, TIM17_CH1N, TIM1_CH2N]
      PA5: [TIM1_CH1, TIM1_CH3N]
      PA6: [TIM16_CH1, TIM3_CH1]
      PA7: [TIM14_CH1, TIM17_CH1, TIM1_CH1N, TIM3_CH2]
      PA8: [TIM14_CH1, TIM1_CH1, TIM1_CH2N, TIM1_CH3N, TIM3_CH3, TIM3_CH4]
      PA9: [TIM1_CH2]
      PA10: [TIM1_CH3]
      PA11: [TIM1_CH4]
      PA14: [TIM1_CH1]
      PA15: [TIM1_CH1]
      PB0: [TIM1_CH2N, TIM3_CH3]
      PB1: [TIM14_CH1, TIM1_CH2N, TIM1_CH3N, TIM3_CH4]
      PB3: [TIM1_CH2, TIM3_CH2]
      PB4: [TIM3_CH1]
      PB5: [TIM3_CH2, TIM3_CH3]
      PB6: [TIM16_CH1N, TIM1_CH2, TIM1_CH3, TIM3_CH1, TIM3_CH2, TIM3_CH3]
      PB7: [TIM16_CH1, TIM17_CH1N, TIM1_CH4, TIM3_CH1, TIM3_CH4]
      PB8: [TIM16_CH1, TIM3_CH1]
      PB9: [TIM17_CH1, TIM3_CH2]
      PC6: [TIM3_CH1]
      PC14: [TIM17_CH1, TIM3_CH2]
      PC15: [TIM3_CH3]
      PF2: [TIM1_CH4]

  - mpn: STM32C051
    match: '^STM32C051'
    verified: true   # read 2026-11-14 from the XML at that commit
    source: >-
      STMicroelectronics STM32_open_pin_data, commit 7d1f1514ed55,
      mcu/STM32C051C8Tx.xml
    debug: {SWDIO: PA13, SWCLK: PA14}   # DEBUG_SWDIO, DEBUG_SWCLK
    shared: {PA14: BOOT0}               # pin PA14-BOOT0
    timers:
      PA0: [TIM16_CH1, TIM1_CH1, TIM2_CH1]
      PA1: [TIM17_CH1, TIM1_CH2, TIM2_CH2]
      PA2: [TIM16_CH1N, TIM1_CH3, TIM2_CH3]
      PA3: [TIM1_CH1N, TIM1_CH4, TIM2_CH4]
      PA4: [TIM14_CH1, TIM17_CH1N, TIM1_CH2N]
      PA5: [TIM1_CH1, TIM1_CH3N, TIM2_CH1]
      PA6: [TIM16_CH1, TIM3_CH1]
      PA7: [TIM14_CH1, TIM17_CH1, TIM1_CH1N, TIM3_CH2]
      PA8: [TIM14_CH1, TIM1_CH1, TIM1_CH2N, TIM1_CH3N, TIM3_CH3, TIM3_CH4]
      PA9: [TIM1_CH2]
      PA10: [TIM1_CH3]
      PA11: [TIM1_CH4]
      PA14: [TIM1_CH1]
      PA15: [TIM1_CH1, TIM2_CH1]
      PB0: [TIM1_CH2N, TIM3_CH3]
      PB1: [TIM14_CH1, TIM1_CH2N, TIM1_CH3N, TIM3_CH4]
      PB3: [TIM1_CH2, TIM2_CH2, TIM3_CH2]
      PB4: [TIM3_CH1]
      PB5: [TIM3_CH2, TIM3_CH3]
      PB6: [TIM16_CH1N, TIM1_CH2, TIM1_CH3, TIM3_CH1, TIM3_CH2, TIM3_CH3]
      PB7: [TIM16_CH1, TIM17_CH1N, TIM1_CH1, TIM1_CH4, TIM3_CH1, TIM3_CH4]
      PB8: [TIM16_CH1, TIM3_CH1]
      PB9: [TIM17_CH1, TIM3_CH2]
      PB10: [TIM2_CH3]
      PB11: [TIM2_CH4]
      PB13: [TIM1_CH1N]
      PB14: [TIM1_CH2N]
      PB15: [TIM1_CH3N]
      PC6: [TIM2_CH3, TIM3_CH1]
      PC7: [TIM2_CH4, TIM3_CH2]
      PC14: [TIM17_CH1, TIM3_CH2]
      PC15: [TIM1_CH2, TIM3_CH3]
      PD0: [TIM16_CH1]
      PD1: [TIM17_CH1]
      PD2: [TIM1_CH1N]
      PD3: [TIM1_CH2N]
      PF0: [TIM14_CH1]
      PF2: [TIM1_CH4]

  # Debug-only rows: the STM32 lines whose SWD pins the corpus's boards use.
  # Every package file read puts SWDIO on PA13 and SWCLK on PA14.
  - mpn: STM32F401
    match: '^STM32F401'
    verified: true   # read 2026-11-14 from the XML at that commit
    source: >-
      STMicroelectronics STM32_open_pin_data, commit 7d1f1514ed55,
      mcu/STM32F401C(B-C)Ux.xml (PA13 SYS_JTMS-SWDIO, PA14
      SYS_JTCK-SWCLK; BOOT0 its own pin)
    debug: {SWDIO: PA13, SWCLK: PA14}

  - mpn: STM32F030
    match: '^STM32F030'
    verified: true   # read 2026-11-14 from the XML at that commit
    source: >-
      STMicroelectronics STM32_open_pin_data, commit 7d1f1514ed55,
      mcu/STM32F030F4Px.xml (PA13 SYS_SWDIO, PA14 SYS_SWCLK; BOOT0 its
      own pin)
    debug: {SWDIO: PA13, SWCLK: PA14}

  - mpn: STM32G030 / STM32G031
    match: '^STM32G03[01]'
    verified: true   # read 2026-11-14 from the XML at that commit
    source: >-
      STMicroelectronics STM32_open_pin_data, commit 7d1f1514ed55,
      mcu/STM32G030F6Px.xml, STM32G030K(6-8)Tx.xml, STM32G031F(4-6-8)Px.xml,
      STM32G031K(4-6-8)Tx.xml (PA13 SYS_SWDIO, pin PA14-BOOT0 SYS_SWCLK)
    debug: {SWDIO: PA13, SWCLK: PA14}
    shared: {PA14: BOOT0}

  - mpn: STM32G431 (LQFP-48)
    match: '^STM32G431C'
    verified: true   # read 2026-11-14 from the XML at that commit
    source: >-
      STMicroelectronics STM32_open_pin_data, commit 7d1f1514ed55,
      mcu/STM32G431C(6-8-B)Tx.xml; CHxN with dead time per ST's
      stm32g4xx-hal-driver (commit a6001282dfac) stm32g4xx_hal_tim_ex.c
      ("Complementary outputs with programmable dead-time")
    timers:
      PA0: [TIM2_CH1]
      PA1: [TIM15_CH1N, TIM2_CH2]
      PA2: [TIM15_CH1, TIM2_CH3]
      PA3: [TIM15_CH2, TIM2_CH4]
      PA4: [TIM3_CH2]
      PA5: [TIM2_CH1]
      PA6: [TIM16_CH1, TIM3_CH1]
      PA7: [TIM17_CH1, TIM1_CH1N, TIM3_CH2, TIM8_CH1N]
      PA8: [TIM1_CH1]
      PA9: [TIM1_CH2, TIM2_CH3]
      PA10: [TIM1_CH3, TIM2_CH4]
      PA11: [TIM1_CH1N, TIM1_CH4, TIM4_CH1]
      PA12: [TIM16_CH1, TIM1_CH2N, TIM4_CH2]
      PA13: [TIM16_CH1N, TIM4_CH3]
      PA14: [TIM8_CH2]
      PA15: [TIM2_CH1, TIM8_CH1]
      PB0: [TIM1_CH2N, TIM3_CH3, TIM8_CH2N]
      PB1: [TIM1_CH3N, TIM3_CH4, TIM8_CH3N]
      PB3: [TIM2_CH2, TIM8_CH1N]
      PB4: [TIM16_CH1, TIM3_CH1, TIM8_CH2N]
      PB5: [TIM17_CH1, TIM3_CH2, TIM8_CH3N]
      PB6: [TIM16_CH1N, TIM4_CH1, TIM8_CH1]
      PB7: [TIM17_CH1N, TIM3_CH4, TIM4_CH2]
      PB8: [TIM16_CH1, TIM4_CH3, TIM8_CH2]
      PB9: [TIM17_CH1, TIM1_CH3N, TIM4_CH4, TIM8_CH3]
      PB10: [TIM2_CH3]
      PB11: [TIM2_CH4]
      PB13: [TIM1_CH1N]
      PB14: [TIM15_CH1, TIM1_CH2N]
      PB15: [TIM15_CH1N, TIM15_CH2, TIM1_CH3N]
      PC13: [TIM1_CH1N, TIM8_CH4N]
      PF0: [TIM1_CH3N]

  - mpn: CY7C68013A / CY7C68014A (FX2LP)
    match: '^CY7C6801[3-6]A'
    verified: true   # Cypress 38-08032 Rev. *K read 2026-11-14
    source: >-
      Cypress CY7C68013A/14A/15A/16A datasheet 38-08032 Rev. *K, Table 4-1
      FX2LP Pin Descriptions: RDY0 or SLRD, RDY1 or SLWR are type Input
      ("SLRD is the input-only read strobe", "SLWR is the input-only
      write strobe"); CTL0-2/FLAGA-C are O/Z
    input_only: [RDY0, RDY1, RDY2, RDY3, RDY4, RDY5]

  - mpn: RP2040 (and the Raspberry Pi Pico / Pico W module)
    # not Pico 2 / RP2350: its function table has not been read here
    match: '^(RP2040|(Raspberry[ _]?Pi[ _]?)?Pico(?![ _-]?2)(?![A-Za-z0-9]))'
    verified: true   # io_bank0.h at pico-sdk 2.1.0 read 2026-11-14
    source: >-
      Raspberry Pi pico-sdk 2.1.0,
      src/rp2040/hardware_regs/include/hardware/regs/io_bank0.h, the
      GPIOn_CTRL FUNCSEL values (the RP2040 datasheet section 2.19.2
      function table): GPIOn's function 3 is I2C((n>>1)&1) SDA for even n,
      SCL for odd n
    i2c:
      GPIO0: I2C0_SDA
      GPIO1: I2C0_SCL
      GPIO2: I2C1_SDA
      GPIO3: I2C1_SCL
      GPIO4: I2C0_SDA
      GPIO5: I2C0_SCL
      GPIO6: I2C1_SDA
      GPIO7: I2C1_SCL
      GPIO8: I2C0_SDA
      GPIO9: I2C0_SCL
      GPIO10: I2C1_SDA
      GPIO11: I2C1_SCL
      GPIO12: I2C0_SDA
      GPIO13: I2C0_SCL
      GPIO14: I2C1_SDA
      GPIO15: I2C1_SCL
      GPIO16: I2C0_SDA
      GPIO17: I2C0_SCL
      GPIO18: I2C1_SDA
      GPIO19: I2C1_SCL
      GPIO20: I2C0_SDA
      GPIO21: I2C0_SCL
      GPIO22: I2C1_SDA
      GPIO23: I2C1_SCL
      GPIO24: I2C0_SDA
      GPIO25: I2C0_SCL
      GPIO26: I2C1_SDA
      GPIO27: I2C1_SCL
      GPIO28: I2C0_SDA
      GPIO29: I2C0_SCL

loads:
  - mpn: DRV8874
    match: '^DRV8874'
    verified: true   # TI SLVSF66A (revised December 2019) read 2026-11-14
    aliases: {EN/IN1: IN1, PH/IN2: IN2}
    when: {pin: PMODE, states: [rail, pulled_up]}
    pwm_group: [IN1, IN2]
    severity: warning
    why: >-
      with PMODE high the bridge is latched into PWM (IN/IN) mode, where
      speed comes from a PWM on IN1 or IN2, so every such input of the
      board's motor drivers wants its own channel of one timer: one counter
      gives them one PWM frequency and aligned edges
    source: >-
      TI DRV8874 SLVSF66A, section 5 pin table (PMODE: "H-bridge control
      input mode"), 7.3.2 Table 2 PMODE Functions ("PMODE = Logic High:
      PWM") and 7.3.2.2 Table 4 PWM Control Mode (IN1/IN2 truth table)

  - mpn: DRV8300
    match: '^DRV8300'
    verified: true   # TI SLVSFG5D (revised March 2022) read 2026-11-14
    pwm_pairs: [[INHA, INLA], [INHB, INLB], [INHC, INLC]]
    severity: warning
    why: >-
      the DRV8300's high-side and low-side inputs operate independently
      (it only turns both gates off when both inputs are high, and adds a
      200-2000 ns dead time), so each half-bridge's two inputs want one
      timer channel's complementary CHx/CHxN outputs, where the MCU's
      dead-time generator and break input keep the two switches apart,
      and all three legs want one counter
    source: >-
      TI DRV8300 SLVSFG5D, Table 6-1 pin functions (INHx high-side, INLx
      low-side gate driver inputs) and 8.3.1.1.2 Deadtime and
      Cross-Conduction Prevention ("high-side and low-side inputs operate
      independently")

# The voltage a part's pins take, from each datasheet's absolute maximum
# ratings table, for netlist_audit.py's offboard_input rule (class 3 of
# docs/miss-taxonomy.md): a net that leaves the board is judged against
# the receiving pin's limits, both ways, with its level and its clamps.
#
# receivers:
#   match     regex tried against the part's Value, then its symbol name
#             (case-insensitive)
#   pins      regex on the pin function (upper-cased, ~{...} dropped) of
#             the pins the row covers; without it, every pin not of a
#             power type
#   pintypes  regex on the KiCad pin type, when only some pins carry the
#             rating (logic parts: VI is the inputs' rating)
#   supply    regex on the pin function whose rail VDD is in vmax_vdd
#   vdd       V: that rail on a module whose supply pin isn't the I/O rail
#   vmin      V: the lowest the pins take (a negative number); none: not
#             rated below ground in the table
#   vmax      V: the most the pins take, or
#   vmax_vdd  V: the most above the supply rail
# diodes: small-signal silicon diodes a design uses as clamps.
#   vf_max    V: the datasheet's guaranteed most forward drop at if_ma
#             mA. A clamp to a rail lets the pin go that far past the
#             rail; past the pin's rating, the clamp doesn't protect it.
# cite / verified as in io_levels.yaml: `bin/hwde part_rows --verify`
# checks each quote is on its page and each cited number is in the quote.
# A finding only an unverified row makes is reported as not judged.
#
# Rated by clamp current only (VI < 0 or VI > VCC at +-20 mA; CD74AC161,
# CD74AC238, SN74HC595, SN74HC166): no voltage row, so not judged.
#
# Seeded from the errata corpus: smart-lcc-2, fc980c-2, zxdiag-v11-2/-3.


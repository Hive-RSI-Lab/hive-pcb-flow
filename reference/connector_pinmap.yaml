# Connector pin-map families - read by scripts/check_mate_pins.py
# (MECH-05 mated pairs, MECH-06 identical unkeyed connectors).
#
# A footprint belongs to a family when its footprint name (the part after
# "lib:") matches the family's `match` regex (case-insensitive, first family
# wins). Anything unmatched is UNKNOWN: a declared pair is still checked pin by
# pin, but the family rules below (mates, keyed) are skipped for it.
#
#   keyed  - false when a plug made for one of two identical footprints also
#            fits the other (bare pin headers and sockets). Two connectors on
#            one board with the same footprint id in an unkeyed family must
#            carry the same supply rail on every pin (mate_unkeyed_rail_swap);
#            a keyed family is skipped, because the plug only goes where it was
#            meant to and only one way round.
#   mates  - the families this one plugs into. A declared pair whose two
#            footprints are both known and not listed as mates is reported
#            (mate_family_mismatch), as is a pair whose pad patterns do not
#            overlay.
#   gender - male (pins) or female (sockets); with row_pitch_mm (how far
#            apart a 2-row part's rows are) it is what a stated mate (a pair
#            with mate_standard, below) is judged against.
#
# How a declared pair is lined up (mount, in constraints.json mating_pairs):
#   stack - the mate board sits over or under this one the same way up (a
#           socket on its B.Cu over a header on this board's F.Cu). KiCad
#           stores a back-side footprint as placed, so pads of the two
#           connectors that touch sit at the same top-view offset from their
#           pad-pattern centres.
#   flip  - the mate board is turned over about its own y axis before mating
#           (both connectors on F.Cu facing each other): the mate's x offsets
#           are negated first.
#   cable - a straight-through cable or a pass-through pair: pin n meets pin n.
# `rotation` (degrees, counter-clockwise in top view) turns the mate board
# relative to this one before the overlay; pads meet within overlay_tol_mm.

defaults:
  overlay_tol_mm: 0.2

families:
  # JLC/EasyEDA names: HDR-TH_<n>P-P2.54-V-M (male) / -V-F (female)
  - name: pin-header-2.54
    match: '^(PinHeader_\d+x\d+_P2\.54mm|HDR-TH_\d+P-P2\.54-V-M)'
    keyed: false
    gender: male
    row_pitch_mm: 2.54
    mates: [pin-socket-2.54, pin-header-2.54]
  - name: pin-socket-2.54
    match: '^(PinSocket_\d+x\d+_P2\.54mm|HDR-TH_\d+P-P2\.54-V-F)'
    keyed: false
    gender: female
    row_pitch_mm: 2.54
    mates: [pin-header-2.54]
  - name: pin-header-2.00
    match: '^PinHeader_\d+x\d+_P2\.00mm'
    keyed: false
    gender: male
    row_pitch_mm: 2.00
    mates: [pin-socket-2.00, pin-header-2.00]
  - name: pin-socket-2.00
    match: '^PinSocket_\d+x\d+_P2\.00mm'
    keyed: false
    gender: female
    row_pitch_mm: 2.00
    mates: [pin-header-2.00]
  - name: pin-header-1.27
    match: '^PinHeader_\d+x\d+_P1\.27mm'
    keyed: false
    gender: male
    row_pitch_mm: 1.27
    mates: [pin-socket-1.27, pin-header-1.27]
  - name: pin-socket-1.27
    match: '^PinSocket_\d+x\d+_P1\.27mm'
    keyed: false
    gender: female
    row_pitch_mm: 1.27
    mates: [pin-header-1.27]
  # shrouded and polarised families: the housing only takes the plug one way
  - name: idc-box-header
    match: '^(IDC-Header|Box_?Header)'
    keyed: true
    mates: [idc-box-header]
  - name: jst
    match: '^JST_'
    keyed: true
    mates: [jst]
  - name: molex
    match: '^Molex_'
    keyed: true
    mates: [molex]
  - name: board-to-board
    match: '^(Hirose_DF\d+|Samtec_|Panasonic_AXK|Hirose_BM\d+)'
    keyed: true
    mates: [board-to-board]

# Mates stated without a mate board (#1124): a mating_pairs entry
# {"ref": "Z101", "mate_standard": "zx-spectrum-edge"} names the part its
# connector takes - a row here, or a family above (a 1x06 header on a lead
# that ends in a socket: "pin-socket-2.54").
#   mate_gender_mismatch - the connector and its stated mate have the same
#                          gender (a socket on a socket) and the mate is not
#                          one of the connector's family's mates
#   mate_row_spacing     - a 2-row connector whose rows are not row_pitch_mm
#                          apart (any one of a list), within overlay_tol_mm
# pitch_mm, when set, must match the connector's pin pitch too
# (mate_family_mismatch). Fill rows from the maker's drawing; say where.
mate_standards:
  - name: zx-spectrum-edge
    title: ZX Spectrum expansion edge (28-way card-edge fingers, 0.1 in)
    gender: male
    pitch_mm: 2.54
    # the socket's narrow (RT) or wide (RX) dip-solder rows
    row_pitch_mm: [3.56, 5.08]
    source: 'Sullins ABC series .100 in card edge datasheet: RT .140 in x .200 in, RX .200 in x .185 in dip solder'
    url: 'https://mfgdatasheets.nlight.net/25-05846%20Sullins%20ABC18DRTH.pdf'
  - name: raspberry-pi-pico
    title: Raspberry Pi Pico on 0.1 in pin headers (2 x 20)
    gender: male
    pitch_mm: 2.54
    row_pitch_mm: 17.78
    source: 'Pico datasheet: one 0.1 in pitch wider than a standard 40-pin DIP (0.6 in rows), so 0.7 in'
    url: 'https://datasheets.raspberrypi.com/pico/pico-datasheet.pdf'

# Standard headers whose mate is known without a mate board (MECH-05, one
# board): a connector on this board's B.Cu faces down onto a mate lying below
# it face up, so seen from above its pads must make the same pattern as the
# mate's own header. A 2-row odd/even pattern's handedness is the sign of
# (pin 2 - pin 1) x (pin 3 - pin 1) in KiCad's top view (y down); a turn keeps
# it, a mirror (the B.Cu flip of a footprint numbered for F.Cu) flips it, so a
# mirrored back-side header cannot meet its mate in any rotation: the odd and
# even rows swap (mate_mirrored_pinout). F.Cu is not judged: a HAT's socket
# soldered from below (same handedness) and a host face down above (mirrored)
# are both right there.
#   face_up_handedness - the mate's header seen from above, mate face up
#   pins               - numbered pads; the pattern must be 2 rows at pitch_mm
#   supply_pins        - the mate's supply pins; a connector is this header
#                        when at least 2 of its pads carry the matching supply
#                        (one a rail, not only GND) and none carries a supply
#                        on a pin the mate gives another
#   nets               - how a net name is read as each supply (last path
#                        segment, case-insensitive)
standard_headers:
  - name: raspberry-pi-40
    title: Raspberry Pi 40-pin GPIO header
    pins: 40
    pitch_mm: 2.54
    face_up_handedness: 1   # the Pi's PinHeader_2x20 on its F.Cu
    supply_pins:
      3V3: [1, 17]
      5V: [2, 4]
      GND: [6, 9, 14, 20, 25, 30, 34, 39]
    nets:
      3V3: '^\+?(3V3|3\.3V)$'
      5V: '^\+?(5V|5V0|5\.0V)$'
      GND: '^(D|P)?GND$'

# FFC/FPC sockets for a mating_pairs cable (lib/cablelib.py, #485). Which pin
# meets which across a flat cable depends on the cable type (A same-side, B
# opposite-side contacts) and on each socket's handedness, set by:
#   contact - top (contacts on the side away from the board), bottom (towards
#             it) or dual (both: the cable goes in either way up)
#   entry   - tabs (the slot opens on the mounting-tab side, away from the
#             signal leads) or leads (it opens over the signal leads)
# The same part at both ends needs neither (Type B is then straight, Type A
# reversed). A pair's cable.ends {ref: {contact, entry}} overrides a row.
# Fill rows from the maker's drawing only; say where it came from.
ffc_sockets:
  - name: xunpu-fpc-05f
    match: 'FPC-05F-\d+PH20'
    contact: bottom          # LCSC C2856803 listing; drawing PDF unreadable
    source: 'LCSC C2856803 listing (hifi-receiver docs/review-2/dfm.md)'

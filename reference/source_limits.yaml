# What each power source can give, and what each load asks of it, for
# netlist_audit.py's source_limit rule (class 11 of docs/miss-taxonomy.md:
# a load against its source's limit).
#
# regulators: a linear regulator's rated output and its heat limit.
#   match      regex tried against the part's Value, then its symbol name
#              (case-insensitive)
#   kind       ldo (input current = output current)
#   out / in   regex on the output / input pin function
#   iout_max   A: the most output current the datasheet rates the part for
#              (recommended operating conditions, or a guaranteed figure)
#   tj_max     degC: the operating junction temperature limit
#   theta_ja   degC/W: the lowest junction-to-ambient thermal resistance
#              of any package the datasheet lists, so a heat finding holds
#              whichever package is fitted
#   (tj_max and theta_ja are left out when the datasheet gives neither,
#   as Torex's XC6206 gives only package Pd: the heat check is then
#   reported as not judged)
# loads: a part's demand on the rail its supply pins are on.
#   supply     regex on the supply pin function
#   i_supply   A: the current the datasheet says the supply must be able to
#              deliver
#   peak       true when that is a peak the part draws in bursts (a radio's
#              transmit): it counts against iout_max but not as heat
# gpio: an MCU's limits on current from its I/O pins.
#   pins       regex on the I/O pin functions the limits cover
#   supply     regex on the supply pin whose rail drives the pins
#   pin_max    A: the most one pin may source or sink
#   total_max  A: the most all the covered pins together may source (or
#              sink)
# converters: a switching converter's output limits, for the
#   switched_load_droop rule (a capacitive load the constraints declare,
#   switched hard from the converter's output).
#   kind       boost
#   fb         regex on the feedback pin function: the divider on it gives
#              the output volts (vref x (1 + top / bottom))
#   vref       V: the feedback reference
#   uv_pct     %: the FB-falling undervoltage threshold, of vref (PGOOD
#              drops below it)
#   ilim_min   A: the switch current limit's minimum
#   hiccup_cycles  cycles of current limiting that start hiccup mode
# usb: what a USB port gives with no power-delivery negotiation (USB 2.0
#   section 7.2.1 and USB 3.2 section 11.4.1: one unit load after
#   configuration is 100 mA for USB 2, 150 mA for USB 3; a high-power port
#   gives five units, 500 mA, or six, 900 mA).
#
# cite / verified as in io_levels.yaml: `bin/hwde part_rows --verify`
# checks each quote is on its page and each cited number is in the quote.
# A finding only an unverified row makes is reported as not judged.
#
# Seeded from the corpus survey for #1168: every LDO the training and
# holdout boards use that has a datasheet in hand, the ESP32 modules on
# those LDOs' rails, and the MCUs that drive LEDs.


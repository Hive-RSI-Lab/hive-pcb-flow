# Datasheet pin tables, for netlist_audit.py's symbol_pinmap rule (#1135):
# a part with no stock KiCad symbol in the same package is judged against
# its datasheet's pin table instead. A placed symbol whose pins disagree
# with the table (VIN on pin 3 where the table says 2) is a symbol drawn
# from the wrong package or the wrong pinout.
#
#   part       the part and package the table is for
#   match      a regex tried against the part's value, symbol name and MPN
#              (re.match, case-insensitive)
#   footprint  a regex searched in the footprint name after its library
#              (case-insensitive): the package the table is for. A part
#              in another package, or with no footprint, gets no row.
#   pins       {pad number: datasheet name}. Leave out what a footprint
#              numbers its own way (an exposed pad the datasheet calls 0)
#              and pins a range gives (36-53); names compare as
#              pinmaplib.pin_names folds them (VOUT is OUT, CFG2/SCL is
#              CFG2 and SCL). Only names both maps carry are compared.
#   stock      instead of pins: Lib:Symbol, a stock symbol whose pins are
#              the table (a module sold with a symbol in another name)
#   source     the datasheet, its revision, the table
#   cite       [{doc, sha256, page, table, quote, fields: [pins]}] for
#              scripts/part_rows.py --verify: each pin's name must stand
#              beside a run of numbers that holds its number in one of the
#              row's quotes. part_rows.py PART --pdf DS drafts the rows.
# verified: true means the cites passed --verify and a reader checked the
# package column. A row not verified only records its parts as not judged.
#
# Seeded from the parts on the 26 boards and the corpus that have no stock
# symbol in their package (#1135).


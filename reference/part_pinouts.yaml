    source: Diodes AP64350 datasheet, Pin Descriptions
    cite:
    - doc: ap64350.pdf
      sha256: bb9aa134375fc5b87433141e477aff20aee1a8766d922c6d9b9ace1f56539f48
      page: 3
      table: ''
      quote: "BST 1 High-Side Gate Drive Boost Input. BST supplies the drive for the\
        \ high-side n-channel power MOSFET. A \n100nF capacitor is recommended from\
        \ BST to SW to power the high-side driver. \nVIN 2 \nPower Input. VIN supplies\
        \ the power to the IC as well as the step-down converter power MOSFETs. Drive\
        \ \nVIN with a 3.8V to 40V power source. Bypass VIN to GND with a suitably\
        \ large capacitor to eliminate \nnoise due to the switching of the IC. See\
        \ Input Capacitor section for more details. \nEN 3 \nEnable Input. EN is a\
        \ digital input that turns the regulator on or off. Drive EN high to turn\
        \ on the regulator \nand low to turn it off. Connect to VIN or leave floating\
        \ for automatic startup. The EN has a precision \nthreshold of 1.18V for programing\
        \ the UVLO. See Enable section for more details. \nRT/CLK 4 \nResistor Timing\
        \ and External Clock. This pin can be used to control the switching frequency\
        \ by setting the \ninternal oscillator frequency or by synchronizing to an\
        \ external clock. Connect a resistor from RT/CLK to \nGND to set the internal\
        \ oscillator frequency. An external clock can be input directly to the RT/CLK\
        \ pin and \nthe internal oscillator synchronizes to the external clock frequency\
        \ using a PLL. If the external clock edges \nstop, the operating mode automatically\
        \ returns to resistor frequency programming. See Programming \nSwitching Frequency\
        \ section for more details. \nFB 5 Feedback sensing terminal for the output\
        \ voltage. Connect this pin to the resistive divider of the output. \nSee\
        \ Setting the Output Voltage section for more details. \nCOMP 6 Compensation.\
        \ Connect an external RC network to the COMP pin to adjust the loop response.\
        \ See \nExternal Loop Compensation Design section for more details. \nGND\
        \ 7 Power Ground. \nSW 8 Power Switching Output. SW is the switching node\
        \ that supplies power to the output. Connect the output"

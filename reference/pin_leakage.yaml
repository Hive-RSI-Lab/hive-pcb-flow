# What a pin sinks, sources and needs on its net while nothing has set it
# up yet, for netlist_audit.py's pull_vs_leakage and driver_contention
# rules (#1026): an unconfigured FPGA's weak pull-downs, an unprogrammed
# MCU's input leakage, a reset pin's own pull-up, a logic input's
# thresholds.
#
# match: a regex tried against the part's Value, then its symbol name
# (case-insensitive).
# state: when the row holds (unconfigured, from reset).
# pins: each row's `pin` is a regex tried against the netlist pinfunction
#   (upper-cased, KiCad's ~{...} overbar dropped, the text before the first
#   '/') and then against the pin number. A row only counts on a pin whose
#   type is not power. Fields, all worst case over the datasheet's range:
#   ipd       A   the most a weak pull-down sinks (a pull-up must beat it)
#   ipu       A   the most a weak pull-up sources (a pull-down must beat it)
#   leak      A   the most input leakage, either way
#   rpu       ohm [min, max] of an internal pull-up resistor to its supply
#   vil / vih V   the receiver's input thresholds, or
#   vil_frac / vih_frac   the same as a fraction of the pull's rail
#   reset     true on a reset input: two push-pull drivers from other parts
#             on its net fight (driver_contention)
#   source    the datasheet, its revision, the table or section
# cite: where a row's facts are, [{doc, sha256, page, table, quote,
#   fields}]: `bin/hwde part_rows --verify` checks each quote is on its
#   page and each cited field's number is in the quote (#1100). A
#   finding that only a row without verified: true makes is reported
#   as not judged, never as a hit.
# verified: true means the source was re-read for this row.
#
# The rule solves each net that has a pull resistor to a rail of known
# volts (0 ohm hops followed) with the currents of the pins listed here,
# and flags a worst-case level that misses the receivers' VIH (pull-up) or
# VIL (pull-down). A net with no listed receiver is read against CMOS
# 0.7 / 0.3 of the pull's rail.
#
# Seeded from the errata corpus (#1026): glasgow-5, glasgow-6, glasgow-7.

parts:
  - mpn: ECP5 (LFE5U, LFE5UM)
    match: '^LFE5U'
    state: during configuration (unconfigured)
    verified: true   # Lattice FPGA-DS-02012-3.4 read 2026-11-14
    pins:
      - pin: '^P[TBLR]\d+[A-D]$'
        ipd: 150.0e-6
        leak: 10.0e-6
        source: >-
          FPGA-DS-02012-3.4 Table 3.7 DC Electrical Characteristics: IPD
          "I/O Active Pull-down Current, pulling up from logic LOW state"
          max 150 uA for 0 <= VIN <= VCCIO; IIL/IIH max 10 uA. Section 4.1
          Signal Descriptions, P[L/R] and P[T/B]: "During configuration the
          user-programmable I/O are tri-stated with an internal pull-down
          resistor enabled."

  - mpn: CY7C68013A (EZ-USB FX2LP)
    match: '^CY7C6801[3-6]A'
    state: from reset (unprogrammed, ports are inputs)
    verified: true   # Infineon 38-08032 Rev. AD read 2026-11-14
    pins:
      - pin: '^P[A-E][0-7]$'
        leak: 10.0e-6
        vil: 0.8
        vih: 2.0
        source: >-
          38-08032 Rev. AD Table 14 DC Characteristics: VIH min 2 V, VIL max
          0.8 V, II input leakage +-10 uA. Port pin table: Port D pins reset
          to I (input), Z; OED (Port D output enable) resets to 00000000.

  - mpn: STM32G031 / STM32G030
    match: '^STM32G03[01]'
    state: from reset (NRST in its default bidirectional reset mode)
    verified: true   # DS12992 Rev 3 and DS12991 Rev 3 read 2026-11-14 (part_rows --verify)
    pins:
      - pin: '^(NRST|PF2|PF2-NRST)$'
        reset: true
        rpu: [25000, 55000]
        vil_frac: 0.3
        vih_frac: 0.7
        source: >-
          STM32G031x4/x6/x8 datasheet DS12992 Rev 3 Table 55 NRST pin
          characteristics (STM32G030 DS12991 Rev 3 Table 52 gives the same):
          VIL(NRST) max 0.3 x VDDIO1, VIH(NRST) min 0.7 x VDDIO1, RPU weak
          pull-up 25-55 kOhm; RM0444 3.4.1: PF2-NRST resets to bidirectional
          reset mode.
        cite:
          - doc: stm32g031.pdf
            sha256: eac713a5a83d6ecc8439d5f162c172dbff9042379e713a80ecaf95236d6793c4
            page: 76
            table: Table 55
            quote: 'VIL(NRST) NRST input low level voltage - - - 0.3 x V DDIO1 V VIH(NRST) NRST input high level voltage - 0.7 x V DDIO1'
            fields: [vil_frac, vih_frac]
          - doc: stm32g031.pdf
            sha256: eac713a5a83d6ecc8439d5f162c172dbff9042379e713a80ecaf95236d6793c4
            page: 76
            table: Table 55
            quote: 'RPU Weak pull-up equivalent resistor(2) VIN = VSS 25 40 55'
            fields: [rpu]
          - doc: stm32g030.pdf
            sha256: bd4d70f72b2e82c5965a2b92ef3b9c96ad48c0ecdf195cf900d14cd47bff09f5
            page: 65
            table: Table 52
            quote: 'VIL(NRST) NRST input low level voltage - - - 0.3 x V DDIO1 V VIH(NRST) NRST input high level voltage - 0.7 x V DDIO1'
            fields: [vil_frac, vih_frac]
          - doc: stm32g030.pdf
            sha256: bd4d70f72b2e82c5965a2b92ef3b9c96ad48c0ecdf195cf900d14cd47bff09f5
            page: 65
            table: Table 52
            quote: 'RPU Weak pull-up equivalent resistor(2) VIN = VSS 25 40 55'
            fields: [rpu]

      - pin: '^P[A-F]\d+$'
        leak: 5.0e-6
        vil_frac: 0.3
        vih_frac: 0.7
        source: >-
          DS12992 Rev 3 Table 51 and DS12991 Rev 3 Table 48 I/O static
          characteristics: VIL max 0.3 x VDDIO1, VIH min 0.7 x VDDIO1; Ilkg
          +-70 nA on all I/Os but FT_e, 5 uA on FT_e (the worst case is
          taken, as the row covers every port pin).
        cite:
          - {doc: stm32g031.pdf, sha256: eac713a5a83d6ecc8439d5f162c172dbff9042379e713a80ecaf95236d6793c4, page: 71, table: Table 51, quote: '0.3 x VDDIO1', fields: [vil_frac]}
          - {doc: stm32g031.pdf, sha256: eac713a5a83d6ecc8439d5f162c172dbff9042379e713a80ecaf95236d6793c4, page: 71, table: Table 51, quote: '0.7 x VDDIO1', fields: [vih_frac]}
          - {doc: stm32g031.pdf, sha256: eac713a5a83d6ecc8439d5f162c172dbff9042379e713a80ecaf95236d6793c4, page: 71, table: Table 51, quote: 'FT_e (5) 0 < VIN < VDDIO1 --5 µ A', fields: [leak]}
          - {doc: stm32g030.pdf, sha256: bd4d70f72b2e82c5965a2b92ef3b9c96ad48c0ecdf195cf900d14cd47bff09f5, page: 60, table: Table 48, quote: '0.3 x VDDIO1', fields: [vil_frac]}
          - {doc: stm32g030.pdf, sha256: bd4d70f72b2e82c5965a2b92ef3b9c96ad48c0ecdf195cf900d14cd47bff09f5, page: 60, table: Table 48, quote: '0.7 x VDDIO1', fields: [vih_frac]}
          - {doc: stm32g030.pdf, sha256: bd4d70f72b2e82c5965a2b92ef3b9c96ad48c0ecdf195cf900d14cd47bff09f5, page: 60, table: Table 48, quote: 'FT_e (5) 0 < VIN < VDDIO1 --5 µ A', fields: [leak]}

  - mpn: 74LVC1G08
    match: '74LVC1G08'
    state: always (VCC 3 V to 3.6 V)
    verified: true   # TI SCES217AA (August 2026) read 2026-11-14
    pins:
      - pin: '^[12]$'
        leak: 5.0e-6
        vil: 0.8
        vih: 2.0
        source: >-
          SCES217AA 5.3 Recommended Operating Conditions: VIH min 2 V and VIL
          max 0.8 V at VCC = 3 V to 3.6 V; 5.5 Electrical Characteristics: II
          +-5 uA.

  # Seeded with scripts/part_rows.py (#1100): drafted from the datasheet,
  # each cite checked with part_rows --verify against the PDF named.
  - mpn: STM32F103
    match: '^STM32F103'
    state: from reset (GPIOs floating inputs, NRST bidirectional)
    verified: true   # ST DS5319 Rev 19 read 2026-11-14 (part_rows --verify)
    pins:
      - pin: '^NRST$'
        reset: true
        rpu: [30000, 50000]
        vil: 0.8
        vih: 2.0
        source: >-
          DS5319 Rev 19 Table 39 NRST pin characteristics: VIL(NRST) max
          0.8 V, VIH(NRST) min 2 V, RPU 30-50 kOhm.
        cite:
          - {doc: stm32f103c8.pdf, sha256: daf9ebe5299018a3cfa37f660ce9517b49010167d57d892c1e2164e65d98461f, page: 66, table: Table 39, quote: 'NRST Input low level voltage - –0.5 - 0.8', fields: [vil]}
          - {doc: stm32f103c8.pdf, sha256: daf9ebe5299018a3cfa37f660ce9517b49010167d57d892c1e2164e65d98461f, page: 66, table: Table 39, quote: 'NRST Input high level voltage - 2 - V DD+0.5', fields: [vih]}
          - {doc: stm32f103c8.pdf, sha256: daf9ebe5299018a3cfa37f660ce9517b49010167d57d892c1e2164e65d98461f, page: 66, table: Table 39, quote: 'VIN = VSS 30 40 50', fields: [rpu]}
      - pin: '^P[A-G]\d+$'
        leak: 1.0e-6
        vil_frac: 0.35
        vih_frac: 0.65
        source: >-
          DS5319 Rev 19 Table 36 I/O static characteristics: all I/Os except
          BOOT0 VIL max 0.35 VDD, VIH min 0.65 VDD; Ilkg standard I/Os +-1 uA
          (VSS <= VIN <= VDD).
        cite:
          - {doc: stm32f103c8.pdf, sha256: daf9ebe5299018a3cfa37f660ce9517b49010167d57d892c1e2164e65d98461f, page: 61, table: Table 36, quote: 'All I/Os except BOOT0 - - 0.35 V DD', fields: [vil_frac]}
          - {doc: stm32f103c8.pdf, sha256: daf9ebe5299018a3cfa37f660ce9517b49010167d57d892c1e2164e65d98461f, page: 61, table: Table 36, quote: 'All I/Os except BOOT0 0.65 VDD', fields: [vih_frac]}
          - {doc: stm32f103c8.pdf, sha256: daf9ebe5299018a3cfa37f660ce9517b49010167d57d892c1e2164e65d98461f, page: 61, table: Table 36, quote: 'Standard I/Os -- ±1 µA', fields: [leak]}

  - mpn: STM32F030
    match: '^STM32F030'
    state: from reset (GPIOs floating inputs, NRST bidirectional)
    verified: true   # ST DocID024849 Rev 3 read 2026-11-14 (part_rows --verify)
    pins:
      - pin: '^NRST$'
        reset: true
        rpu: [25000, 55000]
        source: >-
          DocID024849 Rev 3 Table 49 NRST pin characteristics: RPU 25-55
          kOhm. Its VIL(NRST) 0.3 VDD+0.07 and VIH(NRST) 0.445 VDD+0.398 are
          not fractions of the rail, so the row gives no thresholds.
        cite:
          - {doc: stm32f030f4.pdf, sha256: faac9340687f69518930b13c314561570c7298c4d083bf64a4a39c51587a31dc, page: 65, table: Table 49, quote: 'VIN = VSS 25 40 55', fields: [rpu]}
      - pin: '^P[A-F]\d+$'
        leak: 1.0e-7
        vil_frac: 0.3
        vih_frac: 0.7
        source: >-
          DocID024849 Rev 3 Table 46 I/O static characteristics: all I/Os
          except BOOT0 VIL max 0.3 VDDIOx, VIH min 0.7 VDDIOx; Ilkg +-0.1 uA
          (TC, FT, FTf, TTa digital, VSS <= VIN <= VDDIOx).
        cite:
          - {doc: stm32f030f4.pdf, sha256: faac9340687f69518930b13c314561570c7298c4d083bf64a4a39c51587a31dc, page: 60, table: Table 46, quote: 'All I/Os except BOOT0 pin -- 0.3 V DDIOx', fields: [vil_frac]}
          - {doc: stm32f030f4.pdf, sha256: faac9340687f69518930b13c314561570c7298c4d083bf64a4a39c51587a31dc, page: 60, table: Table 46, quote: 'All I/Os except BOOT0 pin 0.7 VDDIOx', fields: [vih_frac]}
          - {doc: stm32f030f4.pdf, sha256: faac9340687f69518930b13c314561570c7298c4d083bf64a4a39c51587a31dc, page: 61, table: Table 46, quote: 'VSS ≤ VIN ≤ VDDIOx -- ± 0.1 µA', fields: [leak]}

  - mpn: STM32G431
    match: '^STM32G431'
    state: from reset (GPIOs analog/floating, NRST bidirectional)
    verified: true   # ST DS12589 Rev 6 read 2026-11-14 (part_rows --verify)
    pins:
      - pin: '^(NRST|PG10-NRST)$'
        reset: true
        rpu: [25000, 55000]
        vil_frac: 0.3
        vih_frac: 0.7
        source: >-
          DS12589 Rev 6 Table 57 NRST pin characteristics: VIL(NRST) max
          0.3 VDD, VIH(NRST) min 0.7 VDD, RPU 25-55 kOhm.
        cite:
          - {doc: stm32g431cb.pdf, sha256: c2e903e3de4b05c0b5d77e5bfda037ce65e8652c41f7a4fe092f6893c870f6e9, page: 116, table: Table 57, quote: 'voltage -- - 0.3 ₓVDD', fields: [vil_frac]}
          - {doc: stm32g431cb.pdf, sha256: c2e903e3de4b05c0b5d77e5bfda037ce65e8652c41f7a4fe092f6893c870f6e9, page: 116, table: Table 57, quote: 'voltage -0.7 ₓVDD --', fields: [vih_frac]}
          - {doc: stm32g431cb.pdf, sha256: c2e903e3de4b05c0b5d77e5bfda037ce65e8652c41f7a4fe092f6893c870f6e9, page: 116, table: Table 57, quote: 'VIN = VSS 25 40 55', fields: [rpu]}
      - pin: '^P[A-G]\d+$'
        leak: 4.5e-6
        vil_frac: 0.3
        vih_frac: 0.7
        source: >-
          DS12589 Rev 6 Table 53 I/O static characteristics: VIL max 0.3 VDD,
          VIH min 0.7 VDD; Ileak for 0 <= VIN <= VDD is +-100 nA on FT_xx up
          to +-4500 nA on FT_d (the worst case is taken, as the row covers
          every port pin).
        cite:
          - {doc: stm32g431cb.pdf, sha256: c2e903e3de4b05c0b5d77e5bfda037ce65e8652c41f7a4fe092f6893c870f6e9, page: 111, table: Table 53, quote: 'FT_c 1.62 V<VDD<3.6 V - - 0.3xVDD', fields: [vil_frac]}
          - {doc: stm32g431cb.pdf, sha256: c2e903e3de4b05c0b5d77e5bfda037ce65e8652c41f7a4fe092f6893c870f6e9, page: 111, table: Table 53, quote: 'FT_c 1.62 V<VDD<3.6 V 0.7xVDD --', fields: [vih_frac]}
          - {doc: stm32g431cb.pdf, sha256: c2e903e3de4b05c0b5d77e5bfda037ce65e8652c41f7a4fe092f6893c870f6e9, page: 111, table: Table 53, quote: 'FT_d 0 ≤ VIN ≤ VDD - - ±4500', fields: [leak]}

  - mpn: ESP32-C3 (chip, ESP32-C3-MINI-1)
    match: '^ESP32-C3(?!-WROOM)'
    state: always (VDD1 3.3 V)
    verified: true   # Espressif ESP32-C3 v2.5 and ESP32-C3-MINI-1 v2.2 read 2026-11-14
    pins:
      - pin: '^(EN|CHIP_EN)$'
        reset: true
        vil_frac: 0.25
        vih_frac: 0.75
        source: >-
          ESP32-C3 Series Datasheet v2.5 DC characteristics: VIL_nRST max
          0.25 x VDD1, VIH_nRST min 0.75 x VDD1.
        cite:
          - {doc: esp32-c3.pdf, sha256: fede706c39ce663c861136724ffe32dff3f1407fa7f2dac18bbd0d21f0634205, page: 56, table: DC Characteristics, quote: 'is within the specified range) 0.75 × VDD1', fields: [vih_frac]}
          - {doc: esp32-c3.pdf, sha256: fede706c39ce663c861136724ffe32dff3f1407fa7f2dac18bbd0d21f0634205, page: 56, table: DC Characteristics, quote: 'the specified range) ⚶0.3 — 0.25 × VDD1 V', fields: [vil_frac]}
      - pin: '^(GPIO|IO)\d+$'
        leak: 50.0e-9
        vil_frac: 0.25
        vih_frac: 0.75
        source: >-
          ESP32-C3 v2.5 and ESP32-C3-MINI-1 v2.2 DC characteristics: VIH min
          0.75 x VDD1, VIL max 0.25 x VDD1, IIH and IIL max 50 nA.
        cite:
          - {doc: esp32-c3.pdf, sha256: fede706c39ce663c861136724ffe32dff3f1407fa7f2dac18bbd0d21f0634205, page: 56, table: DC Characteristics, quote: 'VIH High-level input voltage 0.75 × VDD1', fields: [vih_frac]}
          - {doc: esp32-c3.pdf, sha256: fede706c39ce663c861136724ffe32dff3f1407fa7f2dac18bbd0d21f0634205, page: 56, table: DC Characteristics, quote: '0.25 × VDD1 V IIH High-level input current — — 50 nA', fields: [vil_frac, leak]}
          - {doc: esp32-c3-mini-1.pdf, sha256: b53790a43866afb431ecc121d1b73d514aea1bf4934906f2eab630310528b1e0, page: 21, table: DC Characteristics, quote: 'VIH High-level input voltage 0.75 × VDD1', fields: [vih_frac]}
          - {doc: esp32-c3-mini-1.pdf, sha256: b53790a43866afb431ecc121d1b73d514aea1bf4934906f2eab630310528b1e0, page: 21, table: DC Characteristics, quote: '0.25 × VDD1 V IIH High-level input current — — 50 nA', fields: [vil_frac, leak]}

  - mpn: ESP32-S3 (chip, ESP32-S3-WROOM-1)
    match: '^ESP32-S3(?!-MINI)'
    state: always (VDD1 3.3 V)
    verified: true   # Espressif ESP32-S3 v2.2 and ESP32-S3-WROOM-1 v1.8 read 2026-11-14
    pins:
      - pin: '^(EN|CHIP_PU)$'
        reset: true
        vil_frac: 0.25
        vih_frac: 0.75
        source: >-
          ESP32-S3 Series Datasheet v2.2 DC characteristics: VIL_nRST max
          0.25 x VDD1, VIH_nRST min 0.75 x VDD1 (the module's EN is CHIP_PU).
        cite:
          - {doc: esp32-s3.pdf, sha256: 2d5a7cb7fd559d8d972bd88db32669c0196d23f22d7afaafb0f63d099b589a3f, page: 65, table: DC Characteristics, quote: 'is within the specified range) 0.75 × VDD1', fields: [vih_frac]}
          - {doc: esp32-s3.pdf, sha256: 2d5a7cb7fd559d8d972bd88db32669c0196d23f22d7afaafb0f63d099b589a3f, page: 65, table: DC Characteristics, quote: 'the specified range) ⚶0.3 — 0.25 × VDD1 V', fields: [vil_frac]}
      - pin: '^(GPIO|IO)\d+$'
        leak: 50.0e-9
        vil_frac: 0.25
        vih_frac: 0.75
        source: >-
          ESP32-S3 v2.2 and ESP32-S3-WROOM-1 v1.8 DC characteristics: VIH
          min 0.75 x VDD1, VIL max 0.25 x VDD1, IIH and IIL max 50 nA.
        cite:
          - {doc: esp32-s3.pdf, sha256: 2d5a7cb7fd559d8d972bd88db32669c0196d23f22d7afaafb0f63d099b589a3f, page: 65, table: DC Characteristics, quote: 'VIH High-level input voltage 0.75 × VDD1', fields: [vih_frac]}
          - {doc: esp32-s3.pdf, sha256: 2d5a7cb7fd559d8d972bd88db32669c0196d23f22d7afaafb0f63d099b589a3f, page: 65, table: DC Characteristics, quote: '0.25 × VDD1 V IIH High-level input current — — 50 nA', fields: [vil_frac, leak]}
          - {doc: esp32-s3-wroom-1.pdf, sha256: 27d71971da07c280c6068d08c74720d1a25b8f20cf8494dc1765bdd28d40d435, page: 27, table: DC Characteristics, quote: 'VIH High-level input voltage 0.75 × VDD1', fields: [vih_frac]}
          - {doc: esp32-s3-wroom-1.pdf, sha256: 27d71971da07c280c6068d08c74720d1a25b8f20cf8494dc1765bdd28d40d435, page: 27, table: DC Characteristics, quote: '0.25 × VDD1 V IIH High-level input current — — 50 nA', fields: [vil_frac, leak]}

                {doc: lmg1020.pdf, sha256: 4a25e40c21b910a8008e3e8b77a97fd16b42cc743cfbc0cacec37b2c5585c13d, page: 16, table: '', quote: 'This bypass capacitor has to be at least a 0.1 µF, up to 1 µF', fields: [min, max]}]}

  # PCB-0010 bb-buck (#1225).
  - mpn: LMR33630
    match: '^LMR3363[0-9]'
    verified: true   # TI SNVSAN3F read 2026-11-15, Pin Functions and 9.2.2.6-9.2.2.8

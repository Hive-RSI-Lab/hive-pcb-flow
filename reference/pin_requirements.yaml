# Parts a datasheet requires at a pin, for netlist_audit.py's pin_part_missing
# rule: per IC, which part (capacitor, inductor, resistor) must sit between
# one of its pins and another of its pins, and of what value.
#
# match: a regex tried against the part's Value, then its symbol name
# (case-insensitive).
# Pins are named as the netlist's pinfunction gives them, upper-cased, with
# KiCad's ~{...} overbar dropped; `aliases` maps other names a symbol may use
# onto those.
# Each requirement:
#   id      the datasheet's own name for the part (CBK, CVM1, ...)
#   pin     the pin the part serves
#   to      the other pin of the same IC the part's far end goes to (its net
#           is whatever net that pin is on)
#   kinds   the part kinds that do: C, L, R (from the refdes letter)
#   value   nominal; a part qualifies within one E3 step either side (/2.2,
#           x2.2) unless min/max (base units, F/H/ohm) say otherwise.
#           No value and no min/max: any part of the kind does.
#   when    connected: only when `pin` is on a real net (an unused buck's
#           SW_BK left open needs no inductor); undriven: also only when no
#           pin of another part than a two-pin R/C/L is on `pin`'s net (a
#           reference input fed from an ADC reference needs no divider)
#   distinct  true: `pin` and `to` tied into one net is the part missing
#           (AD8232 SW shorted to IAOUT has no second high-pass capacitor);
#           without it a tie means there is nothing to span
#   severity  error (default) | warning, when the part is missing
#   effective  true: min is effective capacitance at the part's DC (the
#           cited quote says so). mlcc_dcbias.py then holds the net `pin` is
#           on to it, derated; pin_part_missing still checks the nominal
#           (#1067). A min the datasheet gives as a nominal part stays
#           without it.
#   source  where the datasheet says it (document, revision, table/section)
#   cite    [{doc, sha256, page, table, quote, fields}]: the quote is text
#           on that page; fields the row's numbers it gives (value, min,
#           max). `bin/hwde part_rows --verify` checks them (#1100).
# verified: true means the datasheet was re-read for the part's rows. A
# finding only a part without it makes goes under not_judged, never as a
# fault. `bin/hwde part_rows PART --pdf FILE` drafts rows from "connect a
# 0.1-uF capacitor between VBST and SW" sentences as verified: false.
#
# Errata corpus: minuet v3 shipped the MCF8316D with no capacitor drawn for
# FB_BK; the +3.3V rail it sits on had caps, all drawn for other sheets'
# parts. Fill this table from datasheet_extract's `pin_requirements` field
# when a part's extraction gives one.
#
# Datasheet application circuits (#1158, rank 6 of the miss taxonomy):
# healthmonitor HM-Rev1 shipped the AD8232 with SW tied to IAOUT (no 4.7 uF
# second high-pass capacitor) and REFIN fed by one 10 M to the supply, its
# lower resistor and capacitor wired to the supply instead of GND.

parts:
  - mpn: MCF8316D
    match: '^MCF8316D'
    verified: true   # SLLSFX9A (Dec 2024, rev. May 2025) Table 10-1 read 2026-10-30
    requires:
      - {id: CVM1, pin: VM, to: PGND, kinds: [C], value: 100n,
         source: "SLLSFX9A Table 10-1: X7R 0.1 uF, rated 2x VM"}
      - {id: CVM2, pin: VM, to: PGND, kinds: [C], min: 10.0e-6,
         source: "SLLSFX9A Table 10-1: >= 10 uF, rated 2x VM"}
      - {id: CCP, pin: CP, to: VM, kinds: [C], value: 1u,
         source: "SLLSFX9A Table 10-1 and pin table: X7R 1 uF 16 V, CP to VM"}
      - {id: CFLY, pin: CPH, to: CPL, kinds: [C], value: 47n,
         source: "SLLSFX9A Table 10-1: X7R 47 nF, rated 2x VM"}
      - {id: CAVDD, pin: AVDD, to: AGND, kinds: [C], value: 1u,
         source: "SLLSFX9A Table 10-1: X7R 1 uF >= 10 V, 0.7-1.3 uF effective at 3.3 V"}
      - {id: CDVDD, pin: DVDD, to: DGND, kinds: [C], value: 1u,
         source: "SLLSFX9A Table 10-1: X7R 1 uF >= 6.3 V, 0.7-2.5 uF effective at 1.5 V"}
      - {id: CBK, pin: FB_BK, to: GND_BK, kinds: [C],
         source: "SLLSFX9A Table 10-1: X7R, buck-output rated (characterised at 22 uF; minuet's errata fits 1 uF with the buck unused)"}
      - {id: LBK, pin: SW_BK, to: FB_BK, kinds: [L, R], when: connected,
         source: "SLLSFX9A Table 10-1 and 7.3.3.2: buck inductor, or a resistor in resistor mode (< 10 mA)"}

  - mpn: AD8232
    match: '^AD8232'
    verified: true   # ADI AD8232 Rev. A read 2026-11-14 (pin table, Figures 47, 55, 62, 64)
    aliases: {GND_1: GND, GND_2: GND, VS: +VS, "+VS": +VS}
    requires:
      - id: C2
        pin: SW
        to: IAOUT
        kinds: [C]
        when: connected
        distinct: true
        source: >-
          AD8232 Rev. A Table 3 pin 6: SW connects to the output of the
          second high-pass filter; Figure 55: C2 from IAOUT to SW. Figure 62
          (one-pole) leaves SW open, which the rule allows.
        cite:
          - {doc: ad8232.pdf, sha256: 7c205ac952614a6f5694451dcbd8f5c3943509b6b4f12c0331e21a0f2ee3ac76, page: 6, table: 'Pin Function Descriptions', quote: 'SW Fast Restore Switch Terminal. Connect this terminal to the output of the second high-pass filter.', fields: []}
          - {doc: ad8232.pdf, sha256: 7c205ac952614a6f5694451dcbd8f5c3943509b6b4f12c0331e21a0f2ee3ac76, page: 21, table: 'Two-Pole High-Pass Filter', quote: 'Note that the right side of C2 connects to the SW terminal.', fields: []}
      - id: R_REFIN_TOP
        pin: REFIN
        to: +VS
        kinds: [R]
        when: undriven
        source: >-
          AD8232 Rev. A Figure 47 and Application Circuits: REFIN is set by
          a divider (two 10 M) unless driven from a reference
        cite:
          - &ad_div {doc: ad8232.pdf, sha256: 7c205ac952614a6f5694451dcbd8f5c3943509b6b4f12c0331e21a0f2ee3ac76, page: 17, table: '', quote: 'The reference voltage level is set at the REFIN pin. It can be set with a voltage divider or by driving the REFIN pin from some other point in the circuit', fields: []}
          - &ad_two {doc: ad8232.pdf, sha256: 7c205ac952614a6f5694451dcbd8f5c3943509b6b4f12c0331e21a0f2ee3ac76, page: 24, table: '', quote: 'The schematic also shows two 10 MΩ resistors to set the midscale reference voltage.', fields: []}
      - id: R_REFIN_BOT
        pin: REFIN
        to: GND
        kinds: [R]
        when: undriven
        source: >-
          AD8232 Rev. A Figure 47 and Application Circuits: the divider's
          lower resistor, REFIN to GND
        cite: [*ad_div, *ad_two]
      - id: C_REFIN
        pin: REFIN
        to: GND
        kinds: [C]
        when: undriven
        severity: warning
        source: >-
          AD8232 Rev. A Figure 47: a capacitor in parallel with the lower
          divider resistor filters the reference
        cite:
          - {doc: ad8232.pdf, sha256: 7c205ac952614a6f5694451dcbd8f5c3943509b6b4f12c0331e21a0f2ee3ac76, page: 17, table: '', quote: 'Furthermore, use a capacitor in parallel with the lower resistor on the divider for additional filtering', fields: []}

  - mpn: TPS563201
    match: '^TPS563201'
    verified: true   # TI SLVSD90B read 2026-11-14
    aliases: {BST: VBST, BOOT: VBST}
    requires:
      - {id: CBST, pin: VBST, to: SW, kinds: [C], value: 100n,
         source: "TPS563201 pin table and 7.2.2.5: 0.1 uF ceramic from VBST to SW",
         cite: [{doc: tps563201.pdf, sha256: c1b5f22fdc2fd8bd8ff5f2281dcbee5fb09e30617f3ee008a320a85c0d94b517, page: 16, table: 'Bootstrap Capacitor Selection', quote: 'A 0.1-µF ceramic capacitor must be connected between the VBST to SW pin for proper operation.', fields: [value]}]}

  - mpn: TPS561201
    match: '^TPS561201'
    verified: true   # TI SLVSC95A read 2026-11-14
    aliases: {BST: VBST, BOOT: VBST}

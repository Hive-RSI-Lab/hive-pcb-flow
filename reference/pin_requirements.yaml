         cite: [{doc: ap64350.pdf, sha256: bb9aa134375fc5b87433141e477aff20aee1a8766d922c6d9b9ace1f56539f48, page: 3, table: 'Pin Descriptions', quote: '100nF capacitor is recommended from BST to SW to power the high-side driver.', fields: [value]},
                {doc: ap64350.pdf, sha256: bb9aa134375fc5b87433141e477aff20aee1a8766d922c6d9b9ace1f56539f48, page: 15, table: '', quote: 'To ensure proper operation, a ceramic capacitor must be connected between the BST and SW pins.', fields: []}]}

  - mpn: ADR4520
    match: '^ADR452[05]'
    # ADI ADR4520/4525/4530/4533/4540/4550 Rev. B, Chinese edition (LCSC
    # C579305): analog.com was unreachable from the tower (#1227). Recite
    # from the English edition when it can be fetched.
    verified: true   # read 2026-11-15, table 12 and the ADR4520 table
    requires:
      - {id: COUT, pin: VOUT, to: GND, kinds: [C], min: 1.0e-6, max: 100.0e-6,
         source: "ADR4520 Rev. B (Chinese edition) output capacitor section and table 12: ADR4520/ADR4525 need COUT of at least 1.0 uF for stability; the ADR4520 table gives load capacitance 1 to 100 uF",
         cite: [{doc: adr4520.pdf, sha256: 512ab2dfe214da568c1b7a4db91cba1246c6d6be9947984a6cf47501d0e42923, page: 31, table: '表12', quote: '出于稳定性和滤除低电平电压噪声的考虑，需要使用一个输 出电容。输出电容的最小值见表12。', fields: []},
                {doc: adr4520.pdf, sha256: 512ab2dfe214da568c1b7a4db91cba1246c6d6be9947984a6cf47501d0e42923, page: 31, table: '表12', quote: 'ADR4520、ADR4525 1.0 µF', fields: [min]},
                {doc: adr4520.pdf, sha256: 512ab2dfe214da568c1b7a4db91cba1246c6d6be9947984a6cf47501d0e42923, page: 4, table: '', quote: '负载电容 1 100 µF', fields: [max]}]}

  - mpn: TPS7A20
    match: '^TPS7A20'
    verified: true   # TI SBVS338H read 2026-11-14
    aliases: {VIN: IN, VOUT: OUT}
    requires:
      - {id: COUT, pin: OUT, to: GND, kinds: [C], min: 0.47e-6, max: 200.0e-6,
         effective: true,
         source: "TPS7A20 pin table OUT and Recommended Operating Conditions note 3: 0.47 uF to 200 uF effective, required for stability",
         cite: [{doc: tps7a20.pdf, sha256: 3b7c1495906b88f48223f21a9bba1aad2f1d90a673fc3394aa6b5b5ece52ff53, page: 3, table: '', quote: 'A low equivalent series resistance (ESR) capacitor is required from OUT to ground for stability.', fields: []},
                {doc: tps7a20.pdf, sha256: 3b7c1495906b88f48223f21a9bba1aad2f1d90a673fc3394aa6b5b5ece52ff53, page: 5, table: 'Recommended Operating Conditions', quote: 'Effective output capacitance of 0.47 μF minimum and 200 μF maximum is required for stability.', fields: [min, max]}]}

  # PCB-0021 lipo-boost (#1226). XC61C (U3, voltage detector) has no row:
  # the Torex datasheet could not be fetched from the tower and no LCSC copy
  # exists; its open-drain output is held by the LED and connector on 0021.
  - mpn: BQ24074
    match: '^BQ2407[2-59]'
    verified: true   # TI SLUS810N read 2026-11-15, Table 7-1 and 6.3
    aliases: {EP: VSS, GND: VSS}
    requires:
      - {id: CIN, pin: IN, to: VSS, kinds: [C], min: 1.0e-6, max: 10.0e-6,
         when: connected,
         source: "SLUS810N Table 7-1 IN: bypass capacitor 1 uF to 10 uF to VSS",
         cite: [{doc: bq24074.pdf, sha256: 4fe4e4f9855501f83b400c6932e3098439e51c50539e40dc45b44a8d509e8db1, page: 8, table: 'Table 7-1. Pin Functions', quote: 'Connect bypass capacitor 1 μF to 10 μF to VSS.', fields: [min, max]}]}
      - {id: COUT, pin: OUT, to: VSS, kinds: [C], min: 4.7e-6, max: 47.0e-6,
         source: "SLUS810N Table 7-1 OUT: bypass OUT to VSS with a 4.7 uF to 47 uF ceramic capacitor",
         cite: [{doc: bq24074.pdf, sha256: 4fe4e4f9855501f83b400c6932e3098439e51c50539e40dc45b44a8d509e8db1, page: 8, table: 'Table 7-1. Pin Functions', quote: 'Bypass OUT to VSS with a 4.7-μF to 47-μF ceramic capacitor.', fields: [min, max]}]}
      - {id: CBAT, pin: BAT, to: VSS, kinds: [C], min: 4.7e-6, max: 47.0e-6,
         source: "SLUS810N Table 7-1 BAT: bypass BAT to VSS with a 4.7 uF to 47 uF ceramic capacitor",
         cite: [{doc: bq24074.pdf, sha256: 4fe4e4f9855501f83b400c6932e3098439e51c50539e40dc45b44a8d509e8db1, page: 8, table: 'Table 7-1. Pin Functions', quote: 'Bypass BAT to VSS with a 4.7-μF to 47-μF ceramic capacitor.', fields: [min, max]}]}
      - {id: RILIM, pin: ILIM, to: VSS, kinds: [R], min: 1100, max: 8000,
         source: "SLUS810N Table 7-1 ILIM and 6.3 Recommended Operating Conditions: RILIM 1100 to 8000 ohm sets the input current limit; ILIM left open disables charging",
         cite: [{doc: bq24074.pdf, sha256: 4fe4e4f9855501f83b400c6932e3098439e51c50539e40dc45b44a8d509e8db1, page: 8, table: 'Table 7-1. Pin Functions', quote: 'Leaving ILIM unconnected disables all charging.', fields: []},
                {doc: bq24074.pdf, sha256: 4fe4e4f9855501f83b400c6932e3098439e51c50539e40dc45b44a8d509e8db1, page: 10, table: 'Recommended Operating Conditions', quote: 'RILIM Maximum input current programming resistor 1100 8000', fields: [min, max]}]}
      - {id: RISET, pin: ISET, to: VSS, kinds: [R], min: 590, max: 8900,
         source: "SLUS810N Table 7-1 ISET and 6.3 Recommended Operating Conditions: RISET 590 to 8900 ohm sets the fast-charge current; ISET left open disables charging",
         cite: [{doc: bq24074.pdf, sha256: 4fe4e4f9855501f83b400c6932e3098439e51c50539e40dc45b44a8d509e8db1, page: 8, table: 'Table 7-1. Pin Functions', quote: 'Charging is disabled if ISET is left unconnected.', fields: []},
                {doc: bq24074.pdf, sha256: 4fe4e4f9855501f83b400c6932e3098439e51c50539e40dc45b44a8d509e8db1, page: 10, table: 'Recommended Operating Conditions', quote: 'RISET Fast-charge current programming resistor (1) 590 8900', fields: [min, max]}]}
      - {id: RTS, pin: TS, to: VSS, kinds: [R], value: 10k, when: undriven,
         severity: warning,
         source: "SLUS810N Table 7-1 TS: the battery pack's 10 k NTC, or a 10 k fixed resistor TS to VSS when TS is unused. A TS net on a connector (pack NTC) needs no part on the board; a warning, since an NTC drawn with a TH refdes is not an R",
         cite: [{doc: bq24074.pdf, sha256: 4fe4e4f9855501f83b400c6932e3098439e51c50539e40dc45b44a8d509e8db1, page: 9, table: 'Table 7-1. Pin Functions', quote: 'For applications that do not use the TS function, connect a 10-kΩ fixed resistor from TS to VSS to maintain a valid voltage level on TS.', fields: [value]}]}

  - mpn: TPS61023
    match: '^TPS61023'
    verified: true   # TI SLVSF14B read 2026-11-15, 6.3 and 8.2.2.3
    requires:
      - {id: CIN, pin: VIN, to: GND, kinds: [C], min: 1.0e-6, effective: true,

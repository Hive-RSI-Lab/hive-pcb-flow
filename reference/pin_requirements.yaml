                {doc: tps61023.pdf, sha256: a8c0a51b17502e4cb39dbe55852c27ec4579047c76676704ddcb9b4c5da7dd9a, page: 14, table: '', quote: 'TI recommends using the X5R or X7R ceramic output capacitor in the range of 4-μF to 1000-μF effective', fields: [min, max]}]}


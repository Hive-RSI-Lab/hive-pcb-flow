      - {id: CBST, pin: VBST, to: SW, kinds: [C], value: 100n,
         source: "TPS561201 pin table and 8.2.2.5: 0.1 uF ceramic from VBST to SW",
         cite: [{doc: tps561201.pdf, sha256: 54e5a4f272c638b385ec0d66867891cdc2f94974269a2400e80ecb4279b94e2f, page: 3, table: '', quote: 'Connect 0.1-µF capacitor between VBST and SW pins.', fields: [value]},
                {doc: tps561201.pdf, sha256: 54e5a4f272c638b385ec0d66867891cdc2f94974269a2400e80ecb4279b94e2f, page: 14, table: 'Bootstrap Capacitor Selection', quote: 'A 0.1-µF ceramic capacitor must be connected between the VBST to SW pin for proper operation.', fields: [value]}]}

  - mpn: AP64350
    match: '^AP64350'
    verified: true   # Diodes DS41976 Rev. 5-2 read 2026-11-14

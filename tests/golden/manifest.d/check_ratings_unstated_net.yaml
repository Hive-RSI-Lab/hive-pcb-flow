# Seeded fault for check_ratings' bound on a net with no stated voltage (hive-hwde #864).
mutants:
  clamped-net-over-rating:
    board: blinky2
    script: mutations/clamped_net_over_rating.py
    check: check_ratings
    defect: >-
      SIDECAR fault + board edits: D1 becomes a 3.3 V zener from +5V onto
      /LED_A (no stated voltage), so the net is bounded to about 1.7..5.7 V;
      C7, moved onto /LED_A and extracted as a 1 V input, is over its
      rating at that bound
    expect:
      kind: rating_over_voltage
      ref: C7
  tvs-clamped-net-over-rating:
    board: blinky2
    script: mutations/tvs_clamped_net_over_rating.py
    check: check_ratings
    defect: >-
      SIDECAR fault + board edits: D1 becomes a TVS from +5V onto /LED_A whose
      extraction has only free-text VRWM/VBR/VC rows (#867); read as a clamp
      at its VBR top it bounds /LED_A to about 1..5.7 V; C7, moved onto
      /LED_A and extracted as a 1 V input, is over its rating at that bound
    expect:
      kind: rating_over_voltage
      ref: C7
  cathode-clamp-over-power:
    board: blinky2
    script: mutations/cathode_clamp_over_power.py
    check: check_ratings
    defect: >-
      SIDECAR fault: D1 is extracted as a 3.3 V zener with its cathode on
      /LED_A (no stated voltage) and its anode on GND (#868), so it bounds
      /LED_A to 0..3.3 V; parts.json gives it a 10 mW Pd, and its 470 R feed
      from /LED can force about 35 mW through it, over that rating
    expect:
      kind: rating_over_current
      ref: D1
  driven-net-over-rating:
    board: blinky2
    script: mutations/driven_net_over_rating.py
    check: check_ratings
    defect: >-
      SIDECAR fault + board edits: U1 is extracted with its supplies on
      +3V3/GND and pin 15 a push-pull output, so /LED (no stated voltage)
      lies on U1's 0..3.3 V rail (#869); C7, moved onto /LED and extracted
      as a 1 V input, is over its rating at that bound
    expect:
      kind: rating_over_voltage
      ref: C7
  groundless-driver-below-rating:
    board: blinky2
    script: mutations/groundless_driver_below_rating.py
    check: check_ratings
    defect: >-
      SIDECAR fault + board edits: J1 carries -5V; U1 is extracted with its
      VDD pins on +3V3, pin 15 a push-pull output onto /LED (no stated
      voltage) and no ground pin, so its low side is the board's -5V rail,
      not 0 V (#1006); C7, moved onto /LED and extracted as an input rated
      -0.3 V min, is below its rating at the -5..3.3 V bound
    expect:
      kind: rating_reverse_polarity
      ref: C7
  pulled-output-over-rating:
    board: blinky2
    script: mutations/pulled_output_over_rating.py
    check: check_ratings
    defect: >-
      SIDECAR fault + board edits: U1's pin 15 is typed a push-pull output
      onto /LED on its 3.3 V rail, but R2 pulls /LED up from /LED_A, which
      D1 (extracted as a driver, first pad on +5V) holds on a 0..5 V rail; the
      pull-up past U1's rail says the pin is open drain in fact, so /LED
      lies in 0..5 V (#1006); C7, moved onto /LED and extracted as a 3.6 V
      input, is over its rating at that bound
    expect:
      kind: rating_over_voltage
      ref: C7
  driven-clamp-over-power:
    board: blinky2
    script: mutations/driven_clamp_over_power.py
    check: check_ratings
    defect: >-
      SIDECAR fault + board edits: D1 moves onto /LED (no stated voltage) as
      a 1.8 V zener, cathode on /LED and anode on GND; U1 is extracted with
      its supplies on +3V3/GND and pin 15 a push-pull output rated 25 mA, so
      its 3.3 V rail drives past the zener and can force 25 mA through it,
      45 mW against D1's 10 mW Pd (#1006)
    expect:
      kind: rating_over_current
      ref: D1

# Seeded fault for check_kelvin (hc-power cold review 2, R2).
mutants:
  kelvin-tap-past-neck:
    board: blinky2
    script: mutations/kelvin_tap_past_neck.py
    check: check_kelvin
    defect: >-
      MEASUREMENT fault: a current-sense amplifier's tap joins at the inductor's pad,
      past 6 mm of 0.5 mm track from a 10 mOhm shunt, so it reads the copper as
      shunt. Nets connect and widths are legal, so nothing else sees it
    expect:
      kind: kelvin_error
      refs: [R901, U901]
  sense-tap-teed-off-rail:
    board: blinky2
    script: mutations/sense_tap_teed_off_rail.py
    check: check_kelvin
    defect: >-
      MEASUREMENT fault: a feedback divider's sense line, declared in sense_pads to
      read the output capacitor's pad, tees into the rail's power track 7 mm short of
      it, so the regulator holds the rail there. Nets connect and widths are legal,
      so nothing else sees it
    expect:
      kind: sense_tap_off_pad
      refs: [C911, R911]
  sense-tap-back-pour-via:
    board: blinky2
    script: mutations/sense_tap_back_pour_via.py
    check: check_kelvin
    defect: >-
      MEASUREMENT fault (#1356): a feedback divider's sense line comes back up to
      the SMD output capacitor's pad on a via 0.15 mm off it, and a rail pour on the
      back layer reaches that via, so the line reads the pour, not the pad. The via
      sat inside the tap's slack on every layer, so nothing saw it. Quiet twins:
      tests/test_kelvin.py
    expect:
      kind: sense_tap_off_pad
      refs: [C911, R911]
  sense-pair-apart:
    board: blinky2
    script: mutations/sense_pair_apart.py
    check: check_kelvin
    defect: >-
      MEASUREMENT fault: a shunt's two hand-routed sense lines into an amplifier's
      IN+/IN- part 20 mm across, closing a loop of about 280 mm^2 that picks up the
      field of every switching edge. No sense_pads entry or mark names them, so no
      sense rule saw them; nets connect and widths are legal
    expect:
      kind: sense_pair_apart
      refs: [R931, U931]
  sense-line-unmarked:
    board: blinky2
    script: mutations/sense_line_unmarked.py
    check: check_kelvin
    defect: >-
      ROUTING fault: a 3 A rail's shunt is read over 0.2 mm hand-routed sense lines
      with no aiee_sensew mark, so the sense-width rule never covers them and DRC
      holds them to the rail's width
    expect:
      kind: sense_line_unmarked
      refs: [R931, U931]

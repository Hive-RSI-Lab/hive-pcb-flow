# Seeded fault for check_silk pin_labels_missing (errata issue #886).
mutants:
  pin-labels-missing:
    board: blinky2
    script: mutations/pin_labels_missing.py
    check: check_silk
    defect: >-
      J2 carries three motor phases (/PH_A, /PH_B, /PH_C) and no silk text
      near it names its pins, so the motor cable can go on in any order
      (minuet v3 J8, errata issue #886)
    expect:
      kind: pin_labels_missing
      ref: J2
      pos: [142.9344, 110.5]   # J2's pad centroid

  # Seeded fault for check_silk two-column legends (miss class 10).
  silk-legend-unmirrored:
    board: blinky2
    script: mutations/silk_legend_unmirrored.py
    check: check_silk
    defect: >-
      J9, a Raspberry Pi header on B.Cu laid out right for the Pi below,
      carries a B.SilkS legend "5V 3V3 / 5V SDA / GND SCL" written in the
      top side's column order: read from below, the left column is +3V3,
      not 5V, so a cable made to the silk goes on swapped (miss class 10)
    expect:
      kind: pin_label_wrong
      ref: J9
      pos: [98.4, 132.6]   # the legend's position
